# Which program answers each desktop portal in a Hyprland session. This
# replaces /usr/share/xdg-desktop-portal/hyprland-portals.conf (its default
# line is kept as it is) to add the Secret portal, which neither hyprland nor
# gtk implements: without it a Flatpak app cannot reach the keyring.
# oo7-portal on Fedora 45+, gnome-keyring's on Fedora 44; the first one
# installed answers.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Secret=oo7-portal;gnome-keyring
