<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ~/.config/fontconfig/conf.d/60-inter-family.conf; part of the orchard and
  orchard-dark desktop themes (~/.config/themes/orchard/; the font:
  ~/.local/share/fonts/themes/orchard/, README there).

  Inter 4.1 ships as ONE variable file per slant (InterVariable.ttf,
  InterVariable-Italic.ttf), whose family name is "Inter Variable", not
  "Inter", which is the name of the static cuts (Inter.ttc, 13 MB, not
  installed). The themes' stylesheets and theme.conf (font=) ask for "Inter",
  the name every app and toolkit knows the face by, so without this file
  "Inter" fell straight through to the next family in each stack (Adwaita
  Sans): fc-match "Inter" printed Noto Sans before it was added.

  binding="same": the alias is as strong as the name that was asked for, so
  "Inter" resolves to the variable face before Adwaita Sans / IBM Plex Sans
  in a stack, and every weight (300 search field, 500 bar, 600 headings, 700
  title) is a real instance of the variable font, not a synthetic emboldening.
  Nothing else changes: a program that never asks for Inter never sees it.
-->
<fontconfig>
  <alias binding="same">
    <family>Inter</family>
    <prefer>
      <family>Inter Variable</family>
    </prefer>
  </alias>
</fontconfig>
