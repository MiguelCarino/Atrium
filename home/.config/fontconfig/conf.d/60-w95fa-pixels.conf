<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ~/.config/fontconfig/conf.d/60-w95fa-pixels.conf; part of the win95 desktop
  theme (~/.config/themes/win95/; the font: ~/.local/share/fonts/themes/win95/).

  W95FA is a PIXEL font: its outlines are squares on an 80-unit grid, so at
  12.5px (and 25px, 37.5px) every grid pixel is exactly one (two, three) screen
  pixels. Greyscale antialiasing ruins that: W95FA's advance widths are NOT
  whole grid pixels (a "0" is 6.25 of them), so most glyphs land at a
  fractional x and get smeared across two columns; the bar's text came out
  soft grey instead of the crisp black of Windows 95 (measured: screenshots of
  the bar before and after this file). Rendered monochrome, a 1px-wide stem
  covers exactly one pixel centre wherever it lands, so the font draws as the
  bitmap it imitates. Hinting off, so FreeType does not move the stems.

  ONLY FOR THE PROGRAMS THAT DRAW AT SCALE 1. Monochrome is exact only while
  one grid pixel is one device pixel. GTK4 renders at the output's own
  fractional scale: Nautilus on DP-2 (scale 0.8) drew the 12.5px face at 10
  device pixels, off the grid, and monochrome then DROPS glyph pixels:
  "Trash" read "Tiach", "Starred" "Slarred", "Network" "Netwoik". A pixelsize
  test cannot tell the two apart (FC_DEBUG: GTK4 asks for 12.5px on every
  output and scales afterwards), so the rule is keyed on the program instead
  (fontconfig's prgname: g_get_prgname() for GTK programs, else the
  executable's name), and names the ones the theme puts W95FA in that are
  always drawn at scale 1:
    waybar   the bar, the toolbox (and themes/tools/statebar.py), GTK3;
    wofi     the window switcher, GTK3;
    mako     notifications;
    *.py     the popup panels, the launcher, quick note, the clipboard picker:
             PyGObject GTK3 scripts, whose prgname is the script's file name
             (panel.py, launcher.py...). GTK3 has no fractional scale: on DP-2
             the compositor scales the finished surface, which is soft but
             never drops a pixel.
  Every other program (Nautilus and any libadwaita app, which gtk4.css puts in
  W95FA) keeps the desktop's normal antialiasing: a little soft on DP-1,
  intact everywhere. Check one with: fc-match -v 'W95FA:prgname=NAME' antialias

  Only this one family, which only the win95 theme uses; every other face
  keeps the desktop's own antialiasing. Running apps read it at start-up.
-->
<fontconfig>
  <match target="font">
    <test name="family"><string>W95FA</string></test>
    <test name="prgname"><string>waybar</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family"><string>W95FA</string></test>
    <test name="prgname"><string>wofi</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family"><string>W95FA</string></test>
    <test name="prgname"><string>mako</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
  <!-- "contains" is a case-insensitive substring test for strings. -->
  <match target="font">
    <test name="family"><string>W95FA</string></test>
    <test name="prgname" compare="contains"><string>.py</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
