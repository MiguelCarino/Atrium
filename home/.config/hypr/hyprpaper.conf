# hyprpaper -- wallpapers. Started from lua/autostart.lua.
#
# This replaces swww, which the autostart called for years without it ever being
# installed: `swww-daemon` and `swww img` both failed silently at every login, so
# nothing was ever drawn. swww is not in the Fedora repos or the Hyprland COPR
# either, whereas hyprpaper ships in the same COPR that provides Hyprland here.
#
#
# THIS FILE IS ONLY THE FIRST SECOND. The pictures are chosen at run time:
# scripts/wallpaper-slideshow.py (autostart, and wanted by hyprpaper.service so
# it restarts with it) puts back whatever each screen showed last, then changes
# each screen's picture every 10 minutes of it being visible, from one folder
# per screen, named after its connector as `hyprctl monitors` reports it:
#
#     ~/Pictures/Wallpapers/<OUTPUT>/      e.g. DP-1/  HDMI-A-1/
#
# Drop images into those to add them to the rotation (Settings > Wallpaper
# shows the folders; `scripts/screens.py` prints each screen's size). Size each
# one for the screen it lands on AS IT IS SEEN: a rotated screen (transform 1 or
# 3 in the host file) wants a PORTRAIT image. Anything else still displays --
# fit_mode = cover scales it to cover and centre-crops it, so a mismatched
# aspect ratio loses the edges rather than letterboxing. The theme makers
# (scripts/make-*-wallpaper.py --all) render a set for every connected screen.
#
# So nothing here names a screen: the one block below has an empty monitor,
# which is hyprpaper's "every screen" -- what is painted in the moment before
# the slideshow starts (or if it is not running). A ~ in a path is expanded to
# $HOME (hyprpaper 0.8; older versions wanted absolute paths).
#
# Syntax is hyprpaper 0.8's: one wallpaper { } block per output (or one with an
# empty monitor for all of them). The old `preload =` / `wallpaper =
# OUTPUT,path` lines are gone in 0.8 -- preloading is no longer a separate step.
#
# THE DEFAULT IMAGE IS GENERATED, not downloaded: ~/.config/hypr/scripts/
# make-wallpaper.py draws it with pycairo (neon skyline, half-sun, perspective
# grid, in waybar's NEON palette), at the primary screen's size by default. It
# is deliberately dark and kept calm under the bar, because it sits behind
# translucent blurred windows, possibly on an HDR panel. To change it, re-run
# the script (--seed N for a different skyline) and repaint live -- no restart
# needed, the IPC below is what does it:
#     ~/.config/hypr/scripts/make-wallpaper.py
#     hyprctl hyprpaper wallpaper "<OUTPUT>,$HOME/Pictures/Wallpapers/dp1-ultrawide.png"
# (the file name is historical: it is the primary's picture, whatever the
# screen). The cyberpunk theme's skyline-* set is the same script with --seed
# 2 to 5, once per screen folder.
#
# A machine that wants a fixed picture per screen before the slideshow starts
# can add blocks with monitor = <OUTPUT> below the wildcard one (the empty
# monitor is hyprpaper's fallback for screens no block names).
wallpaper {
    monitor  =
    path     = ~/Pictures/Wallpapers/dp1-ultrawide.png
    fit_mode = cover
}

# Hyprland already draws its own background, so the splash text would only ever
# land on top of your wallpaper.
splash = false

# Leaves the IPC socket open so wallpapers can be changed without a restart:
#     hyprctl hyprpaper wallpaper "<OUTPUT>,/path/to/new.png"
# Turn this off only if you want hyprpaper to exit once it has painted.
ipc = on
