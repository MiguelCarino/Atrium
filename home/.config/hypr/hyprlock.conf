# hyprlock -- the lock screen. Called by SUPER+ALT+L (lua/binds.lua) and by
# hypridle's lock_cmd at 10 minutes idle.
#
# Before this file existed hyprlock ran on built-in defaults: no clock, no
# indication of which keyboard layout the password is being typed in.
#
# Layout: the password field, clock and date are on every screen (monitor =
# left empty), behind a blurred, dimmed copy of what each screen had on it.
# They used to be on DP-1 only, which on any other desk -- or this one with
# another primary picked in Settings > Screens -- left the lock with no
# password field where you are looking. Settings > Wallpaper & lock screen
# can still pin them to one screen (lock-screen.py screen OUTPUT).
#
# Colours and fonts follow the desktop theme. Every one of them is a
# variable below; the values here are the cyberpunk theme's (the neon this
# lock was drawn in: Orbitron for the clock, Rajdhani for text, Share Tech
# Mono for the password dots, cyan with magenta, labels glowing via shadow_*
# -- a zero-offset coloured shadow is a glow), and the `source` line after
# them redefines them for the current theme from
# ~/.config/waybar/generated/hyprlock-theme.conf (theme.py's generated
# folder), which theme.py writes at every theme switch
# (scripts/hyprlock_theme.py says where each value comes from). Without that
# file the lock keeps these values -- hyprlock logs the
# failed source and goes on. Change the LAYOUT here; change a colour in
# hyprlock_theme.py, or it will be overwritten at the next theme switch.
#
# Clearing a mistyped password: ESC, Ctrl+U or Ctrl+Backspace.

$font_display    = Orbitron
$font_text       = Rajdhani SemiBold
$font_mono       = Share Tech Mono
$lock_accent     = rgb(00f0ff)
$lock_second     = rgb(ff2a6d)
$lock_text       = rgb(00f0ff)
$lock_dim        = rgba(00f0ff99)
$lock_inner      = rgba(060810d9)
$lock_check      = rgb(f9f002)
$lock_fail       = rgb(ff2a6d)
$lock_alarm      = rgb(b026ff)
$lock_caps       = rgb(f9f002)
$lock_glow       = rgba(00f0ff99)
$lock_shadow     = rgba(ff2a6d8c)
$lock_halo       = rgba(00f0ff73)
$lock_rounding   = 4
$lock_prompt     = ENTER PASSWORD_
$lock_date       = %^A // %d %^B

source = ~/.config/waybar/generated/hyprlock-theme.conf

general {
    hide_cursor = true
    # No grace period here: in this hyprlock it is a CLI flag (--grace), not a
    # config key. hypridle passes it for idle locks only -- see hypridle.conf.
    # Enter on an empty field does nothing instead of counting as a failed try.
    ignore_empty_input = true
}

# Same feel as the desktop's presets (lua/display.lua): the lock fades in
# on a decelerating curve, the unlock fades out faster on an accelerating
# one, and the dots pop on the short ease-out.
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = exitAccel, 0.3, 0, 0.8, 0.15
    animation = fadeIn, 1, 3, easeOutQuint
    animation = fadeOut, 1, 2, exitAccel
    animation = inputFieldDots, 1, 1.5, easeOutQuint
    animation = inputFieldColors, 1, 2.5, easeOutQuint
}

# One background block for every output (empty monitor =). path = screenshot
# freezes what was on screen at lock time and the blur makes it unreadable.
# brightness keeps white text legible over a bright browser page.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.35
    contrast = 1.1
    vibrancy = 0.25
}

input-field {
    monitor =
    size = 380, 54
    outline_thickness = 2
    rounding = $lock_rounding
    inner_color = $lock_inner
    outer_color = $lock_accent $lock_second 135deg
    check_color = $lock_check $lock_accent 120deg
    fail_color  = $lock_fail $lock_alarm 40deg
    capslock_color = $lock_caps
    font_color = $lock_text
    font_family = $font_mono
    shadow_passes = 2
    shadow_size = 8
    shadow_color = $lock_halo
    fade_on_empty = false
    placeholder_text = <span fgalpha="55%">$lock_prompt</span>
    fail_text = <b>$FAIL</b> ($ATTEMPTS)
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 100
    font_family = $font_display
    color = $lock_text
    shadow_passes = 3
    shadow_size = 10
    shadow_color = $lock_glow
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"$lock_date"
    font_size = 22
    font_family = $font_text
    color = $lock_second
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $lock_shadow
    position = 0, 120
    halign = center
    valign = center
}

# Active xkb layout, under the field. With us + latam a few symbols move, so a
# password that "suddenly stopped working" is almost always this. SUPER+Space
# switches layout while locked, same as everywhere else.
label {
    monitor =
    text = $LAYOUT[US,LATAM]
    font_size = 14
    font_family = $font_mono
    color = $lock_dim
    position = 0, -100
    halign = center
    valign = center
}
