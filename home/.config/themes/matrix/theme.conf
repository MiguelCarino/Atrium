# ~/.config/themes/matrix/theme.conf -- phosphor green on black: a terminal
# from the film, not a dark theme with a green tint.
#
# Inherits cyberpunk for every key not set here (theme.py explains the
# format; cyberpunk/theme.conf lists every key). The stylesheets next to this
# file do the rest: waybar.css (bar + toolbox), panel.css, launcher.css,
# wofi.css, mako, gtk4.css (Nautilus). Wallpapers: make-matrix-wallpaper.py.
#
# The rules this theme keeps (and why the CSS looks the way it does):
#   * one hue does almost everything, so STRUCTURE is told apart by lightness
#     -- #00ff41 lit, #008f11 edges and headings, #003b00 grooves and washes;
#   * status cannot be green-on-green: good stays green, but warn is amber
#     #ffb000 and bad is red #ff3030 (@magenta, the base files' "this ends
#     something / bad" hue, becomes that red -- see waybar.css for the
#     structural uses of @magenta that are put back to green);
#   * the HDR panel: no large lit field anywhere. Selections are a green
#     that tops out well below full scale, the wallpapers are capped (PEAK in
#     make-matrix-wallpaper.py), and the glow is on a handful of readouts only.

name=Matrix
order=20

# --- Accent ------------------------------------------------------------------
# Fixed: a phosphor screen has one colour. The display panel greys out the
# follow-the-wallpaper switch, and theme-from-wallpaper.py writes this into
# generated/accent.css and mako's accent file instead of a wallpaper pick.
# Calmer (2026-10-18): green is the accent only -- text is grey in every
# stylesheet now -- and a softer green than the old #00ff41 neon.
accent=#3ddc68
accent_follow=no

# --- Fonts -------------------------------------------------------------------
# Monospace everywhere (font= swaps the base files' "IBM Plex Sans" too).
font=IBM Plex Mono
font_mono=IBM Plex Mono

# --- Hyprland look -----------------------------------------------------------
hypr.rounding=0
hypr.gaps_in=2
hypr.gaps_out=3
hypr.border_size=2
# Structure green to lit and back: the lit stop sits in the middle of the
# frame, like the bright head of a falling column. It used to start at
# #003b00, which put a near-black stop on the top-right corner -- the focused
# frame faded out (1.4:1) right where the eye looks first. Now no edge of the
# focused frame is darker than #008f11 (~5:1 on black). No accent stops: the
# accent is fixed anyway and the gradient IS the theme.
hypr.active_border=rgb(2f4a36) rgb(3ddc68) rgb(2f4a36) 135deg
# Unfocused: about half the structure green -- visible as a seam between two
# tiled windows (the old 33%/27% pair was #001300 on black, i.e. two windows
# fused into one field), still far below the focused frame.
hypr.inactive_border=rgba(2f4a3688) rgba(1e2e2366) 135deg
hypr.accent_stops=
# Light blur: the surfaces are near-opaque black, so blur only has to stop
# the rain behind a translucent window from reading as text.
hypr.blur=yes
hypr.blur_size=4
hypr.blur_passes=2
hypr.blur_brightness=0.70
hypr.blur_contrast=1.00
hypr.blur_vibrancy=0.10
hypr.blur_vibrancy_darkness=0.00
hypr.blur_noise=0.010
hypr.shadow=no
hypr.shadow_color=rgba(3ddc6833)

anim=snappy

# --- Wallpapers --------------------------------------------------------------
# make-matrix-wallpaper.py --all: matrix-1..4.png in every monitor folder.
wallpaper_prefix=matrix-
# The rain MOVES (~/.config/hypr/scripts/make-matrix-rain.py --all renders
# it): a 30 s loop at 10 fps, slow and dim, played by the slideshow over the
# still -- always, under windows too; stopped only in gamemode, and off with
# the display panel's "Moving wallpaper" switch.
wallpaper_video=matrix-rain.mp4

# --- libadwaita (Nautilus) ---------------------------------------------------
gtk_color_scheme=prefer-dark
gtk_accent_color=green

# Icons: Adwaita and every app icon in phosphor green (built by
# ~/.config/hypr/scripts/make-icon-theme.py).
icon_theme=Phosphor

# A phosphor screen is the CRT filter's natural home; only suggested.
crt_suggest=yes

# --- Terminals (COSMIC Terminal, kitty) --------------------------------------
# A green-screen terminal: pure black, opaque (glass=0), and ONLY green text
# -- every ANSI colour is a green of its own lightness, so ls and prompts
# still tell things apart by brightness, not hue. The softer #3ddc68 is the
# body text, not the old #00ff41 neon. All >= 4.5:1 on black (the darkest,
# "red", 5.5:1; bright black, used for dim hints, 5:1); black itself is a
# background colour. Elsewhere matrix text is grey; here, by request, green.
term.font=IBM Plex Mono
glass=0

# COSMIC apps: black, phosphor text, square -- the terminal's title bar is
# the same pure black as its text area.
cosmic.background=#000000
cosmic.foreground=#c8d4cb
cosmic.accent=#3ddc68
cosmic.radius=0

term.background=#000000
term.foreground=#3ddc68
term.cursor=#3ddc68
term.normal=#0f2416 #22963f #3ddc68 #8ff0a8 #2fb553 #5fd481 #74e896 #a8e8b8
term.bright=#4a8a5c #3fcf63 #6ff094 #b8f8c8 #52d97a #85e8a2 #a0f4b8 #d4f8dc

# --- Colours drawn by code ---------------------------------------------------
# Two greens are not enough to tell CPU from GPU at a glance, so the GPU (and
# everything that is "the other series" in a graph) is teal -- still in the
# phosphor family, never a status colour.
color.cpu=#3ddc68
color.gpu=#4fbfae
# The label on the filled critical pill (red): phosphor green on red is the
# one pair colour-blind eyes see as a single smear; pale ink like the rest of
# that pill's text (and like the disk's critical pill).
color.cpu_hot=#eef5ef
color.gpu_hot=#eef5ef
color.pending=#eef5ef
color.net_down=#3ddc68
color.net_up=#4fbfae
color.danger=#ff3030
color.wx_temp=#c8d4cb
color.wx_cool=#6fa8dc
color.wx_warm=#ffb000
color.wx_sun=#ffcc40
color.wx_cloud=#8fa596
color.wx_rain=#6fa8dc
color.wx_storm=#c38fd6
color.wx_snow=#eef5ef
color.wx_moon=#c8d4cb
