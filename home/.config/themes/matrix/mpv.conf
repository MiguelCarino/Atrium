# ~/.config/themes/matrix/mpv.conf -- mpv in the matrix theme (theme.py
# copies it to ~/.config/mpv/theme.conf).
#
# A quiet phosphor screen: uosc with a thin LINE timeline in the green accent,
# square, NO animation (the green-on-everything matrix was dizzying -- motion
# here stays with the video), the calm grey text, IBM Plex Mono for the UI.
# Subtitles in a black box rather than outlined, so they never sit on busy
# picture: grey #c8d4cb on the box is 13:1.

# Colours are QUOTED: in mpv's config files # starts a comment, so a bare
# osd-color=#E6FCFF is an empty value (and mpv says so, and ignores it).
osc=no
osd-bar=no
scripts-append=~~/skins/uosc/uosc

# --- uosc ---------------------------------------------------------------------
script-opts-append=uosc-color=foreground=3ddc68,foreground_text=000000,background=000000,background_text=c8d4cb,curtain=000000,success=3ddc68,error=ff5c5c,match=e0b050,heatmap=2fb553
script-opts-append=uosc-opacity=timeline=0.9,position=1,chapters=0.8,slider=0.9,slider_gauge=1,controls=0,speed=0.8,menu=1,submenu=0.5,border=1,title=1,tooltip=1,thumbnail=1,curtain=0.9,idle_indicator=0.6,audio_indicator=0.5,buffering_indicator=0.3,playlist_position=0.8,heatmap=0.4,pause_indicator=0.7
script-opts-append=uosc-timeline_style=line
script-opts-append=uosc-timeline_line_width=2
script-opts-append=uosc-timeline_size=24
script-opts-append=uosc-progress=windowed
script-opts-append=uosc-progress_size=1
script-opts-append=uosc-border_radius=0
script-opts-append=uosc-text_border=1
script-opts-append=uosc-font_scale=0.95
# Still: no slides or fades; the pause sign stays instead of flashing.
script-opts-append=uosc-animation_duration=0
script-opts-append=uosc-pause_indicator=static

# --- mpv's own messages -------------------------------------------------------
osd-font=IBM Plex Mono
osd-font-size=28
osd-color="#3DDC68"
# Outlined, not opaque-box: that style also drew an empty box in the top-left
# corner whenever no message was up. Phosphor green on a black outline and a
# soft black shadow reads on any picture.
osd-border-style=outline-and-shadow
osd-border-color="#000000"
osd-border-size=3
osd-shadow-offset=1
osd-shadow-color="#C0000000"

# --- subtitles ----------------------------------------------------------------
sub-font=IBM Plex Sans
sub-font-size=42
sub-color="#C8D4CB"
sub-border-style=opaque-box
sub-border-color="#B0000000"
sub-border-size=8
sub-shadow-offset=0

background-color="#000000"