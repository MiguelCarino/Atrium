# ~/.config/themes/orbit/kitty.conf -- kitty options for the orbit theme,
# appended by theme.py to ~/.config/kitty/theme.conf after the term.* colours
# (the console floor #070b14, theme.conf explains them).

# Tabs: flat console keys along the top on the floor colour; the current one
# the teal key with bold ink (9.7:1) and a ▸, the others raised slate with
# the console text #c9d3e0 (10.5:1). Square: a plain separator, no pebbles.
tab_bar_edge top
tab_bar_style separator
tab_separator " "
tab_bar_min_tabs 2
tab_bar_background #070b14
tab_bar_margin_color #070b14
active_tab_foreground #04121a
active_tab_background #5cc8db
active_tab_font_style bold
inactive_tab_foreground #c9d3e0
inactive_tab_background #16223a
inactive_tab_font_style normal
tab_title_template " {index} {title} "
active_tab_title_template " ▸ {title} "

# The cursor: a teal block that blinks briskly (0.5 s, anim=snappy), no
# trail -- a readout cursor does not smear.
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 0

# Links: the terminal's light blue (bright blue #8fbcff, 10.1:1 on the floor),
# a plain underline.
url_color #8fbcff
url_style straight

# A little room round the text; splits with a teal border on the active one,
# the steel hairline on the rest.
window_padding_width 10 12
window_border_width 1pt
active_border_color #5cc8db
inactive_border_color #2a3a57

# The bell: no sound, a dim slate blink (no light flash on the HDR panel) and
# a CAUTION-amber rim -- a bell is "look here", not a fault.
enable_audio_bell no
visual_bell_duration 0.15
visual_bell_color #16223a
bell_border_color #f2b13c

scrollbar scrolled
scrollbar_handle_color #5a7399
