# ~/.config/themes/orbit/theme.conf -- Orbit: a mission-control console. The
# calm, serious, technical look of a flight control room: dark slate-navy
# consoles, hairline steel rules, small letter-spaced labels, mono readouts,
# one cool "telemetry teal" accent -- with real space photographs behind it
# (make-orbit-wallpaper.py: Apollo / ISS photographs, US public domain, and
# Webb images, CC BY 4.0 with credit; `--credits` prints them). The LLM
# chat's mascot is Pip, an original little space probe (mascot_orbit.py).
#
# Not any space agency's brand: no agency name, logo, insignia or mission
# patch appears anywhere in it. "Mission", "telemetry", "GO / NO-GO", "T+"
# and "nominal" are ordinary words.
#
# Inherits cyberpunk for every key not set here (theme.py explains the
# format; cyberpunk/theme.conf lists every key). The files next to this one do
# the rest: waybar.css (bar + toolbox), panel.css, launcher.css, wofi.css,
# mako, gtk4.css (Nautilus), llm-chat.css, hypr.lua, kitty.conf, prompt.sh,
# mpv.conf.
#
# The rules this theme keeps:
#   * DARK consoles for the HDR primary. The bar's pills are OPAQUE slate
#     #0e1626 (luminance 0.008), so no photograph behind them can change a
#     contrast number; the cards are the same slate at 0.96 (0.008 over a
#     dark backdrop, 0.012 over a white window after blur). The only light
#     areas are small fills: the teal of a selected / today / ON control
#     (0.49), the warn amber of the location pill (0.51), the red of an
#     armed tile or the mic pill (0.26);
#   * text #dbe4f0 on the slate 14.1:1, labels #8a9bb4 6.4:1, readouts
#     #e8edf5 15.4:1 -- never #ffffff;
#   * the ACCENT ROLE (@cyan in every base stylesheet, mako's border) is
#     telemetry teal #5cc8db, a desaturated cyan, NOT cyberpunk's #00f0ff:
#     9.3:1 as text on the slate, ink #04121a on it as a fill 9.7:1. It marks
#     what is ON, selected or focused -- as a 2px underline, the console's
#     "this key is lit" -- and is never a status. Fixed (accent_follow=no,
#     below says why); the display panel's custom colour still replaces it,
#     because every stylesheet uses @cyan for the role;
#   * status keeps mission control's own three: GO green #4fd18b, CAUTION
#     amber #f2b13c, WARNING red #f0565a (CIEDE2000 from the teal: 28, 44
#     and 66; from each other >= 38). Red is only for real problems (muted
#     audio, a lost network, a full disk, critical load, unpushed work, the
#     armed "this ends the session" tiles). The base files' STRUCTURAL
#     magenta (the CPU edge, headings, weekdays, the playing player, the
#     replay buffer) is put back to steel or teal, as aero puts it back to
#     sky and lofi to lilac.

name=Orbit
order=80

# --- Accent ------------------------------------------------------------------
# Fixed. The photographs would vote orange or gold (the Pillars' and the
# Cosmic Cliffs' dust, Earthrise's lit limb) -- the CAUTION amber -- or a
# near-black blue that is not text-safe. moe, lofi and luna keep theirs fixed
# for the same kind of reason.
accent=#5cc8db
accent_follow=no

# --- Language ----------------------------------------------------------------
lang=en

# --- Fonts -------------------------------------------------------------------
# Barlow (OFL): a low-contrast grotesk drawn after the signs and plates of
# California's highways -- the plain, engineered sans of a console label.
# Barlow Semi Condensed SemiBold for headings and the small spaced labels,
# set in the stylesheets. JetBrains Mono (OFL) for the readouts (the clock,
# key caps) and the terminals. ~/.local/share/fonts/themes/orbit/README has
# the sources and hashes. Barlow is narrower than Plex with a shorter line
# (1.20 em against 1.30), so most panels come out a little smaller than
# cyberpunk's, as aero's and luna's do (panel.css has the numbers). Its
# figures are proportional by default; every base stylesheet already asks
# for "tnum", which Barlow has, so readouts do not twitch.
font=Barlow, IBM Plex Sans
font_mono=JetBrains Mono, IBM Plex Mono

# --- Hyprland look -----------------------------------------------------------
# Small corners and a thin frame: the focused window is lit teal at one
# corner fading into the steel rule, the rest a dark navy hairline.
hypr.rounding=4
hypr.gaps_in=4
hypr.gaps_out=8
hypr.border_size=2
hypr.active_border=rgb(5cc8db) rgb(2a3a57) 45deg
hypr.inactive_border=rgb(1c2840)
# A custom accent (the display panel's colour button) replaces the teal stop.
hypr.accent_stops=1
# A light frost, only where the base already blurs (the bar's and panels'
# layers): the consoles are nearly opaque, so the blur only keeps a busy
# window behind a card from showing through as noise. Dimmed to 0.75 so a
# white window behind a card is knocked down before the slate goes over it.
hypr.blur=yes
hypr.blur_size=5
hypr.blur_passes=2
hypr.blur_brightness=0.75
hypr.blur_contrast=1.00
hypr.blur_vibrancy=0.10
hypr.blur_vibrancy_darkness=0.20
hypr.blur_noise=0.010
# A subtle black drop, no colour: nothing glows in a control room.
hypr.shadow=yes
hypr.shadow_range=14
hypr.shadow_render_power=3
hypr.shadow_color=rgba(00000080)

# Brisk and exact, no overshoot.
anim=snappy

# --- Wallpapers --------------------------------------------------------------
# make-orbit-wallpaper.py --all: orbit-{earthrise,marble,aurora,nightpass,
# cliffs,pillars,deepfield}.jpg on every monitor; the top 106 px faded dark,
# HDR-capped. No moving wallpaper.
wallpaper_prefix=orbit-
wallpaper_video=

# --- libadwaita (Nautilus) ---------------------------------------------------
# prefer-dark: the theme is dark, and gtk4.css sets the colours.
gtk_color_scheme=prefer-dark
gtk_accent_color=teal

# Icons: Papirus-Dark with blue-grey (steel) folders (make-icon-theme.py
# orbit builds the folder links, as it does Lofi's).
icon_theme=Orbit

# The pointer: Catppuccin's light arrow with a dark outline (GPL-2.0,
# ~/.local/share/icons; README-downloaded there) -- a pale, neutral pointer
# that reads on the slate and on a white page alike.
cursor_theme=catppuccin-mocha-light-cursors

crt_suggest=no

# --- Terminals (COSMIC Terminal, kitty) --------------------------------------
# The console floor #070b14 (luminance 0.004). Measured (WCAG) on it:
#   foreground #dbe4f0 15.3:1, cursor #5cc8db 10.1:1;
#   normal  red 5.8, green 10.2, yellow 10.4, blue 8.1, magenta 8.2, cyan
#           10.1, white 13.0 (normal black #1c2638 is a background colour
#           only, 1.3);
#   bright  black #7a8aa4 5.6 (hints, autosuggestions, comments), red 7.9,
#           green 12.3, yellow 12.5, blue 10.1, magenta 10.5, cyan 12.2,
#           white 16.7.
# With the glass below over theme.py's worst case (#adadad behind, the
# brightest blurred photograph; theme.py's worst_case()): text 12.9:1, the
# dimmest colour (normal red) 4.9:1. readable_glass() would allow up to 30
# (its floor for colours is 3.0); 12 -- cyberpunk's -- keeps every colour
# >= 4.5, which holds up to 16 (4.52) and fails from 17 (4.43).
term.font=JetBrains Mono
term.font_size=14
term.bright_bold=yes
glass=12
term.background=#070b14
term.foreground=#dbe4f0
term.cursor=#5cc8db
term.normal=#1c2638 #f0565a #4fd18b #f2b13c #6aa7ff #c792ea #5cc8db #c9d3e0
term.bright=#7a8aa4 #ff7b7e #7fe0a8 #f7c766 #8fbcff #d6aef2 #86d8e6 #e8edf5

# --- COSMIC apps (the terminal's title bar...) -------------------------------
# The terminal's own floor, so the title bar and the text are one pane; the
# teal accent; corners about half of stock, nearer the theme's 3-4 px.
cosmic.background=#070b14
cosmic.foreground=#dbe4f0
cosmic.accent=#5cc8db
cosmic.radius=0.5

# --- Colours drawn by code ---------------------------------------------------
# Graph lines, Pango labels and weather glyphs. They land on the opaque
# slate pill #0e1626 and on the card (#0e1625 over a dark backdrop, #151d2c
# over a white window after blur): every one >= 8.6:1 on the pill and
# >= 8.2:1 on the card, so the numbers below are for the pill / the card
# over white. None is a status hue unless it means one: CIEDE2000 distance
# to good / warn / bad is given where a colour sits near one of them.
#
# CPU teal (the accent's own hue, 9.3 / 8.6); GPU a pale lichen #c0d0a8
# (11.1 / 10.3) -- green-ish, but a grey green: chroma 22 against GO's 57,
# dE 16.8 from good and 25.3 from warn, so it never reads as GO.
color.cpu=#5cc8db
color.gpu=#c0d0a8
# The critical pill is a deep red fill #8f1d24; the labels turn to the
# readout white there (#e8edf5 on it 7.5:1; teal would be 4.5).
color.cpu_hot=#e8edf5
color.gpu_hot=#e8edf5
# Pending updates: the box glyph in teal (9.3).
color.pending=#5cc8db
# Network: down teal (9.3 / 8.6), up a pale sand #dcc8ac (11.1 / 10.4).
# Sand, not amber: chroma 17 against CAUTION's 67, dE 17.8 from warn and
# 33 from bad; #f6c177, the obvious "amber-ish" pick, is dE 7.1 from warn,
# the same colour to the eye.
color.net_down=#5cc8db
color.net_up=#dcc8ac
# "Sure?" and the repos / updates panels' danger markup: the light WARNING
# red, 7.2 / 6.7 (the base red #f0565a is 5.3 / 5.0 -- fine, but small).
color.danger=#ff7b7e
# Weather: the temperature graph teal; the day ranges ice blue -> sand
# (10.2 / 9.5 and 11.1 / 10.4).
color.wx_temp=#5cc8db
color.wx_cool=#a9c4ec
color.wx_warm=#dcc8ac
# Glyphs: a pale sun #f0d9a0 (13.0 / 12.2; chroma 31, dE 15.0 from warn),
# steel cloud, ice rain, lavender storm, readout-white snow, pale moon.
color.wx_sun=#f0d9a0
color.wx_cloud=#b8c4d4
color.wx_rain=#a9c4ec
color.wx_storm=#c4b0f0
color.wx_snow=#e8edf5
color.wx_moon=#d6dcf0

# --- The dock and the taskbar (scripts/dock.py; dock.css next to this file
# draws both) ------------------------------------------------------------------
# The word beside the taskbar's start glyph: a console key's legend, spaced capitals like the date's.
dock.start=LAUNCH
