# ~/.config/themes/orbit/mpv.conf -- mpv in the orbit theme (theme.py copies it
# to ~/.config/mpv/theme.conf).
#
# A screen on the flight console: plain uosc (no theme HUD -- uosc's own pause
# flash is enough, as in aero, win95 and luna), the timeline and the chosen
# item in telemetry teal with ink text, menus and controls on the slate
# console face with light text, 3 px corners, quick fades (anim=snappy).
# mpv's messages in Barlow and the subtitles in Barlow SemiBold, light
# #e8edf5 (never white) with a console-floor outline -- no glow.
# How and when the controls show, the controls row and the message /
# subtitle sizes are the same in every theme (~/.config/themes/mpv-base.conf,
# written above this file); this one sets colours, faces and shape.
#
# Contrast, WCAG: foreground_text ink #04121a on the teal #5cc8db 9.7:1;
# background_text #dbe4f0 on the slate #0e1626 14.1:1; the played teal line
# against the unplayed slate 9.3:1 (a UI graphic, >= 3). success= is GO green
# #4fd18b (9.3 on slate), error= is WARNING red #f0565a -- drawn as text on
# the slate (5.3) AND as the Updater's button fill under the ink (5.6).
# match= (the search-match letters) is drawn on normal rows AND on the active
# row, which is the teal foreground: no one colour reads well on both, so it
# is the light text #e8edf5, bold (15.4:1 on slate, 1.7:1 on the active row)
# -- the limit lofi and moe note too.
#
# Colours are QUOTED: in mpv's config files # starts a comment.

osc=no
osd-bar=no
scripts-append=~~/skins/uosc/uosc

# --- uosc ---------------------------------------------------------------------
script-opts-append=uosc-color=foreground=5cc8db,foreground_text=04121a,background=0e1626,background_text=dbe4f0,curtain=070b14,success=4fd18b,error=f0565a,match=e8edf5,heatmap=5cc8db
script-opts-append=uosc-opacity=menu=0.96,submenu=0.6,tooltip=0.96,curtain=0.7
script-opts-append=uosc-border_radius=3
script-opts-append=uosc-animation_duration=120
script-opts-append=uosc-chapter_ranges=openings:5cc8db60,endings:3d547880,ads:f0565a80

# --- mpv's own messages ---------------------------------------------------------
osd-font=Barlow
osd-color="#E8EDF5"
osd-border-color="#070B14"

# --- subtitles ----------------------------------------------------------------------
sub-font=Barlow SemiBold
sub-color="#E8EDF5"
sub-border-color="#070B14"

# Letterbox: black, like every theme -- the bars are not part of the look.
background-color="#000000"
