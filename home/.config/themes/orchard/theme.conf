# ~/.config/themes/orchard/theme.conf -- Orchard: a frosted light desktop -- menu bar, notch, Inter.
# The light appearance of the pair (orchard-dark/ is the dark one and
# inherits every key it does not set from here). The look of a recent
# macOS desktop, drawn plainly with our own means: a translucent light menu
# bar across the whole top edge (the leaf mark, the focused app's name in
# bold, workspaces as small dots on the left; monochrome status glyphs and
# "Tue 27 Oct  21:21" on the right), the dynamic island as the black notch
# in its middle, frosted Control-Centre-like cards, a Search-style
# launcher, top-right notification cards, Nautilus with three traffic-light
# dots on the LEFT of its header, and a springy, smooth window motion.
#
# Nothing in it is Apple's: no Apple logo (the mark is Font Awesome's leaf),
# no San Francisco font (Inter, OFL -- ~/.local/share/fonts/themes/orchard/
# README), no Apple wallpaper (make-orchard-wallpaper.py draws 25 originals
# that EVOKE the eras, never copies), no Apple sound (make-theme-sounds.py
# orchard synthesises a glassy tink, a soft pop and a marimba), and the
# LLM chat's mascot is Hum, an original honeybee (mascot_orchard.py) -- no
# fruit. The icons are the open WhiteSur set (GPL-3.0) with every Apple-logo
# icon deleted (~/.local/share/icons/README-downloaded). No user-visible
# string names an Apple product: the launcher says "Search".
#
# Inherits cyberpunk for every key not set here (theme.py explains the
# format; cyberpunk/theme.conf lists every key). The files next to this one
# do the rest: waybar.css (bar + toolbox), panel.css, launcher.css,
# wofi.css, mako, gtk4.css (Nautilus), llm-chat.css, hypr.lua, kitty.conf,
# prompt.sh, mpv.conf.
#
# Day and night: theme-schedule.py switches whole themes, so the two
# appearances are two themes. To follow the sun:
#     ~/.config/hypr/scripts/theme-schedule.py day orchard
#     ~/.config/hypr/scripts/theme-schedule.py night orchard-dark
# (With theme_auto=on a manual `theme.py set orchard` holds only until the
# next day/night boundary.)
#
# The rules this theme keeps (and why the CSS looks the way it does):
#   * HDR-DIMMED, the luna rule: no LARGE field above luminance 0.52. The
#     menu bar is alpha(#c7c7cd, 0.88) over Hyprland's blur -- luminance
#     0.43-0.52 over the 25 orchard wallpapers' calm (mostly dark) top band,
#     so its text holds 4.5:1 there (waybar.css header); the panel cards
#     #b5b5bb (0.46), Nautilus's view #bebec3 (0.52), its window face
#     #b3b3b8 (0.45). The lightest fills are small: the slider fill and
#     the switch knobs (white, a few px), the mascot's stage #c4c4ca (0.55,
#     one card);
#   * the ACCENT ROLE (@cyan in every base stylesheet) is the system blue
#     #007aff, fixed (accent_follow=no) -- a dune or bloom wallpaper's hue
#     vote would land on orange (reads as warn). As text it is the deeper
#     #0058c4 (@accent-text, 4.6:1 on the cards); as a FILL under white
#     #0062cc (@accent-fill, 5.8:1). The display panel's custom colour still
#     replaces @cyan (the caret, rings, the slider run);
#   * no coloured borders anywhere: frames are 1px neutral hairlines, and
#     blue appears only where something is SELECTED, ON or FOCUSED;
#   * status keeps the "increased contrast" system hues on light -- green
#     #248a3d, orange #b25000, red #d70015 -- each CIEDE2000 > 30 from the
#     others and from the blue. On the bar they are text, never filled
#     pills (the one exception: the REC dot), in still deeper shades so they
#     read on the frosted strip (waybar.css has the numbers).

name=Orchard
order=100

# --- Accent ------------------------------------------------------------------
# Fixed system blue (see the header). @cyan is #007aff wherever a base
# stylesheet asks for the accent; the stylesheets set the text and fill
# shades of it by name.
accent=#007aff
accent_follow=no

# --- Language ----------------------------------------------------------------
lang=en

# --- Fonts -------------------------------------------------------------------
# Inter 4.1 (variable, OFL; ~/.local/share/fonts/themes/orchard/README) -- the
# nearest open face to the system sans this desktop is modelled on. Its
# variable file is the family "Inter Variable"; ~/.config/fontconfig/conf.d/
# 60-inter-family.conf maps "Inter" onto it. Adwaita Sans (GNOME's fork of
# Inter, installed) is the fallback, so the look survives a missing folder.
# Adwaita Mono (installed, with a Bold) stands in for the terminal's mono.
font=Inter, Adwaita Sans, IBM Plex Sans
font_mono=Adwaita Mono, IBM Plex Mono

# --- Hyprland look -----------------------------------------------------------
# A recent macOS window: 10px squircle corners (rounding_power 2.6 bends the
# corner into a superellipse, not a quarter circle), a 1px NEUTRAL hairline
# (black at 22% focused, 14% not -- never the accent), comfortable gaps, and
# a large soft shadow dropped 14px below each window, deeper under the
# focused one. Hyprland draws no title bars; the traffic lights live where an
# app draws its own header (gtk4.css: Nautilus).
hypr.rounding=10
hypr.rounding_power=2.6
hypr.gaps_in=6
hypr.gaps_out=12
hypr.border_size=1
hypr.active_border=rgba(00000038)
hypr.inactive_border=rgba(00000024)
# Empty: the accent never paints a window frame.
hypr.accent_stops=
# Vibrancy: a wide, smooth frost (3 passes of 10) a touch dimmed (0.90) with
# the wallpaper's colour pulled through (vibrancy 0.30) -- the "material"
# behind the bar, the cards, mako and the launcher.
hypr.blur=yes
hypr.blur_size=10
hypr.blur_passes=3
hypr.blur_brightness=0.90
hypr.blur_contrast=1.0
hypr.blur_vibrancy=0.30
hypr.blur_vibrancy_darkness=0.20
hypr.blur_noise=0.012
hypr.shadow=yes
hypr.shadow_range=48
hypr.shadow_render_power=2
hypr.shadow_color=rgba(0000005c)
hypr.shadow_color_inactive=rgba(00000030)
hypr.shadow_offset=0 14

# "spring" (lua/display.lua): windows pop in from 92% with a ~3% overshoot
# that settles, workspaces glide sideways, closing is quick and plain --
# bouncy but smooth, the way this desktop moves.
anim=spring

# --- Wallpapers --------------------------------------------------------------
# make-orchard-wallpaper.py --all: orchard-01-azure-swoosh.png ...
# orchard-25-alpine-lake.png, 25 ORIGINAL renderings, one per era of the
# desktop this theme evokes (the script's VARIANTS list says which), the same
# names on every monitor. No moving wallpaper.
wallpaper_prefix=orchard-
wallpaper_video=

# --- libadwaita (Nautilus) ---------------------------------------------------
# prefer-DARK although the window is light, for luna's and win95's reason:
# gtk4.css sets every colour libadwaita varies by scheme, so a fresh window
# looks the same either way -- but an already running Nautilus gets the
# scheme live and gtk.css only at its next start, and under prefer-light it
# fell back to stock Adwaita's #ffffff view on the HDR primary. Blue is the
# stock accent nearest the system blue.
gtk_color_scheme=prefer-dark
gtk_accent_color=blue
# The window controls on the LEFT, close first: where gtk4.css draws them as
# the red / yellow / green dots.
gtk_button_layout=close,minimize,maximize:

# Icons: WhiteSur (vinceliuice, GPL-3.0), the open set drawn after this
# desktop's style, with every Apple-logo icon removed after install
# (~/.local/share/icons/README-downloaded). WhiteSur-light here: plain
# WhiteSur draws its status/tray glyphs near-white (#f2f2f2) for dark
# panels, about 1.6:1 on this light toolbox card; -light draws them #363636.
icon_theme=WhiteSur-light

# Cursor: WhiteSur-cursors (vinceliuice, GPL-3.0), the black arrow with a
# white rim.
cursor_theme=WhiteSur-cursors

# An LCD-era desktop: no scanline suggestion.
crt_suggest=no

# --- The dynamic island ------------------------------------------------------
# ON whenever an Orchard theme is entered (theme.py set hands these to
# island.py and snapshots your previous values; leaving for a theme that
# sets no island.* key puts them back). The NOTCH design, matched to the
# bar: the bar's centre capsules become the black notch hanging from the top
# edge, the camera housing that live activities open out of.
island.enabled=yes
island.style=notch
island.match_bar=yes

# --- The menu-bar layout -----------------------------------------------------
# bar.clock: empty, so the date and time stay in the centre -- inside the
# island's notch, with the weather and the updates / git / bell indicators.
# (bar.clock=menubar would move them to the far right as "Tue 27 Oct  21:21",
# real macOS's place, but then the notch has no clock; the owner wants it in
# the island.)
# bar.logo: the left-most mark, Font Awesome's leaf (U+F06C) -- never the
# Apple logo. Its click is the power menu, as a menu bar's mark is, so the
# power pill at the far right hides under this theme (clock.py power).
# bar.workspaces=dots: the workspaces as small dots (filled for the visible
# one, rings for the others).
bar.clock=
bar.logo=
bar.workspaces=dots

# --- Terminals (COSMIC Terminal, kitty) --------------------------------------
# The terminal's Basic profile: dark ink on a light page -- the page DIMMED
# for HDR to #c4c4c9 (luminance 0.55, a window-sized field, as luna's cream
# is), opaque (glass=0), a grey block cursor. The ANSI hues are the deep
# "increased contrast" ones, but a dimmed page costs them contrast; measured
# (WCAG) on #c4c4c9:
#   foreground #1d1d1f 9.7:1, cursor #5a5a5f 4.0:1 (a block: >= 3);
#   normal  black 9.7, red 4.3, green 3.2, yellow 3.1, blue 5.9, magenta
#           4.3, cyan 3.3, white #6e6e73 2.9 (the grey of dim output);
#   bright  black #4f4f54 4.7, red 3.1, green 2.5, yellow 2.8, blue 4.4,
#           magenta 3.5, cyan 2.7, white #3a3a3c 6.5.
# Coloured output is mostly bold or a status word in a line of ink, so the
# 2.5-3.3 of bright green / yellow / cyan is the price of the light page;
# orchard-dark is the appearance for long colour-heavy sessions.
# Bold is drawn in the bright colours (term.bright_bold).
term.font=Adwaita Mono
term.font_size=13
term.bright_bold=yes
glass=0
term.background=#c4c4c9
term.foreground=#1d1d1f
term.cursor=#5a5a5f
term.normal=#1d1d1f #b00000 #007a00 #7a6a00 #0030b0 #9a009a #00727c #6e6e73
term.bright=#4f4f54 #d70015 #248a3d #8a6d00 #0040dd #b000b0 #00808a #3a3a3c

# COSMIC apps: the terminal's page and ink, the system blue, the 10px-ish
# corners.
cosmic.background=#c4c4c9
cosmic.foreground=#1d1d1f
cosmic.accent=#007aff
cosmic.radius=0.75

# --- Colours drawn by code ---------------------------------------------------
# The right side of the bar is the light frosted strip (monochrome, like the
# real status menus); the weather glyph sits in the BLACK notch (island
# match_bar) -- or, with the island off, in a small dark well of its own
# (waybar.css) -- so the wx_* colours are light. The weather panel draws
# them in a deep-blue "weather widget" well (panel.css); the CPU / GPU /
# network graphs sit on the light card, so those are dark.
#
# CPU / GPU: the labels on the bar and the sensors panel's graphs: a dark
# grey, 6.3:1 on the bar (#c0c0c6), 5.6:1 on the card (#b5b5bb).
color.cpu=#3a3a3c
color.gpu=#3a3a3c
# Critical load: the red, as text (the bar never fills a pill).
color.cpu_hot=#d70015
color.gpu_hot=#d70015
# Pending updates: the box glyph, orange, in the black notch (a
# glyph: >= 3; 4.0:1 on black).
color.pending=#b25000
# Network graphs on the card: ink, 8.3:1.
color.net_down=#1d1d1f
color.net_up=#1d1d1f
# "Sure?" and the repos / updates panels' danger markup on the light card.
color.danger=#d70015
# wx_temp: the weather panel's 24-hour temperature line. It is a GTK3
# DrawingArea straight on the card -- it paints no CSS background, and its
# parent is the whole panel body, so no well can go under it (luna found the
# same) -- so it is the accent text blue, 3.2:1 on the card (a graph line:
# >= 3). A light #e5e5ea there was 1.4:1, invisible.
color.wx_temp=#0058c4
# The three days' low..high bars, inside the blue .wx-days well (#184e94): sky 4.9:1, amber 4.6:1.
color.wx_cool=#9ecbff
color.wx_warm=#ffb340
# Weather glyphs: in the black notch (8.4-18.8:1) and the blue well
# (3.3-7.4: rain and storm are the 3.3 / 3.4, glyphs, >= 3).
color.wx_sun=#ffd60a
color.wx_cloud=#c7c7cc
color.wx_rain=#64aaff
color.wx_storm=#bf8cff
color.wx_snow=#f2f2f7
color.wx_moon=#e0dcff

# --- The dock and the taskbar (scripts/dock.py; dock.css next to this file
# draws both) ------------------------------------------------------------------
# The dock is the frosted shelf, and its icons grow under the pointer
# (magnification: dock.py's magnify setting follows this unless set on or
# off). The taskbar's start button is the glyph alone: no word.
dock.magnify=yes
