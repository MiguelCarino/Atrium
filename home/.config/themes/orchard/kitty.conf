# ~/.config/themes/orchard/kitty.conf -- kitty options for the orchard theme,
# appended by theme.py to ~/.config/kitty/theme.conf after the term.* colours
# (the dimmed light page #c4c4c9; theme.conf explains them).
#
# The terminal's Basic profile: ink on a light page, a grey block cursor
# that blinks at the system's half-second, no bell sound, a little air round
# the text.

# Tabs along the top, plain separators: the current tab bold on the page
# colour lifted a little (#d0d0d4, ink 10.9:1), the others dim grey text on
# the page's own grey (#4f4f54 on #b9b9be 4.2:1) -- the flat tab strip of a
# window's tab bar, no pebbles.
tab_bar_edge top
tab_bar_style separator
tab_separator " "
tab_bar_min_tabs 2
tab_bar_background #b9b9be
tab_bar_margin_color #b9b9be
active_tab_foreground #1d1d1f
active_tab_background #d0d0d4
active_tab_font_style bold
inactive_tab_foreground #4f4f54
inactive_tab_background #b9b9be
inactive_tab_font_style normal
tab_title_template "  {title}  "
active_tab_title_template "  {title}  "

# The cursor: a block, half-second blink, no trail.
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 0

# Links: the accent text blue (#0058c4, 3.8:1 on the page) under a curly
# underline -- the colour says "link", the curl says "you can click".
url_color #0058c4
url_style curly

# 8px of air round the text; splits with a neutral hairline, darker on the
# active one (never the accent: frames are neutral in this theme).
window_padding_width 8
window_border_width 1pt
active_border_color #8e8e93
inactive_border_color #b0b0b5

# The bell: silent and no flash (an HDR flash of the light page is a glare);
# the tab's title gets kitty's bell mark instead (its default bell_on_tab).
enable_audio_bell no
visual_bell_duration 0

scrollbar scrolled
scrollbar_handle_color #8e8e93
