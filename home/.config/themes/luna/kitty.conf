# ~/.config/themes/luna/kitty.conf -- kitty options for the luna theme,
# appended by theme.py to ~/.config/kitty/theme.conf after the term.* colours
# (the XP-era PowerShell console blue #012456, theme.conf explains them).

# Tabs: flat XP taskbar buttons along the top, a plain separator between
# them; the current one the lit taskbar blue with bold white (5.0:1), the
# others the deep strip blue with pale blue text (7.2:1), on a navy strip.
tab_bar_edge top
tab_bar_style separator
tab_bar_background #0a2a6e
active_tab_background #2f6bd8
active_tab_foreground #ffffff
active_tab_font_style bold
inactive_tab_background #163a8a
inactive_tab_foreground #c9d6f2

# The cursor: the XP console's blinking underline, at its blink rate
# (530 ms, the Windows default caret blink).
cursor_shape underline
cursor_blink_interval 0.53

# Links: a light XP blue (7.2:1 on the console blue), a single underline.
url_color #7fb6ff
url_style single

# Room around the text; splits with the title-bar blue on the active one.
window_padding_width 8
active_border_color #3d86f0
inactive_border_color #163a8a

# The bell: no sound, a short flash of XP's hot-track orange.
enable_audio_bell no
visual_bell_color #f0a030
