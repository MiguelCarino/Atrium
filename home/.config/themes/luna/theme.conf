# ~/.config/themes/luna/theme.conf -- Luna: an original homage to the
# Windows XP era. The bar is the blue XP taskbar (at the top: nothing here
# moves it) with a green "start" button on the left and two blue tray wells
# in the middle; the panels are XP windows -- a blue title band over a
# cream face -- with orange hot-track rims, push buttons and the green
# block progress bar; Nautilus is Explorer with its blue task pane. The
# third of the nostalgia themes, after win95 (order 40) and aero (order 30).
#
# Nothing in it is Microsoft's: no Bliss photograph, no flag or logo, no XP
# sounds, no Microsoft font file. The face is Wine's own Tahoma (LGPL), the
# wallpapers are drawn from scratch (make-luna-wallpaper.py), the sounds are
# synthesized (make-theme-sounds.py luna), the icons are Papirus with yellow
# folders (make-icon-theme.py luna), and the LLM chat's mascot is Folio, a
# cheerful manila folder (mascot_luna.py).
#
# Inherits cyberpunk for every key not set here (theme.py explains the
# format; cyberpunk/theme.conf lists every key). The files next to this one do
# the rest: waybar.css (bar + toolbox), panel.css, launcher.css, wofi.css,
# mako, gtk4.css (Nautilus), llm-chat.css, hypr.lua, kitty.conf, prompt.sh,
# mpv.conf.
#
# The rules this theme keeps (and why the CSS looks the way it does):
#   * the cream is DIMMED for the HDR primary: XP's #ece9d8 face is #c3bea7
#     here (luminance 0.512, about moe's card), Nautilus's view #bfbdb3
#     (0.507); no LARGE surface goes above 0.56 (the toast, 0.562, is
#     small). The lightest fills are small controls: the push-button and
#     text-field face #d8d3bd (0.649, buttons fading down to the 0.512 face)
#     and the slider / switch knobs (#e2ddc8 to #d8d3bd). The
#     bar is a DARK blue strip, luminance 0.056-0.125, across all 3440 px;
#   * the ACCENT ROLE (@cyan in every base stylesheet) is #18439a, a deep
#     version of the XP selection blue: text-safe on the cream (4.87:1) and
#     on Nautilus's view (4.83:1), and white on it as a fill is 9.1:1. The
#     selection FILL is the lighter #316ac5 (white 5.25:1), set explicitly;
#   * the colours the bar and panels DRAW (color.* below) cannot be >= 3:1 on
#     both the mid-blue bar (L 0.10) and the cream cards (L 0.51): no colour
#     is. So panel.css puts the graphs and the weather rows in DARK WELLS --
#     a black Task Manager well for the CPU / GPU / network graphs, a sky
#     well for the weather rows -- and every color.* is chosen for the dark
#     surface it lands on (the table at the bottom says which);
#   * status keeps its own hues, apart from each other and from the blue:
#     good green, warn yellow, bad a coral / deep red. The XP orange
#     (#f0a030) is the hot-track glow on HOVER only, so it never stands in
#     for a warning (warn is always yellow text plus its glyph).

name=Luna
order=70

# --- Accent ------------------------------------------------------------------
# Fixed. A green-hill wallpaper's hue vote lands on green (reads as good) and
# the autumn one on orange (reads as warn), so following the wallpaper would
# put a status colour in the accent role. The display panel's custom colour
# still replaces it everywhere through @cyan (moe and lofi behave the same).
accent=#18439a
accent_follow=no

# --- Language ----------------------------------------------------------------
lang=en

# --- Fonts -------------------------------------------------------------------
# Tahoma: WINE's replacement face (Larry Snyder, from Bitstream Vera Sans;
# LGPL), not Microsoft's file -- ~/.local/share/fonts/themes/luna/README has
# the source, the build and the licences. Latin and Cyrillic only, so IBM
# Plex Sans is the per-glyph fallback (arrows, Greek). Its figures are
# tabular in both weights, so the clock needs no min-width. The build fixes
# one thing in Wine's file, its line spacing (the README says why): with it
# the panels come out within 3% of cyberpunk's, the calendar 6% shorter, as
# aero's is (panel.css has the numbers).
# Liberation Mono (Fedora's liberation-mono-fonts, OFL) has Courier New's
# metrics -- the XP console's TrueType choice -- and a Bold, which COSMIC
# Terminal needs.
font=Tahoma, IBM Plex Sans
font_mono=Liberation Mono, IBM Plex Mono

# --- Hyprland look -----------------------------------------------------------
# The focused frame is the XP title bar: lit at the top, the title-bar blue
# in the middle, deep blue at the bottom (90deg runs the gradient top to
# bottom). The inactive frame is XP's pale inactive title. Hyprland rounds
# all four corners, where XP rounded only the top two; 8px is XP's top-corner
# size.
hypr.rounding=8
hypr.gaps_in=3
hypr.gaps_out=6
hypr.border_size=3
hypr.active_border=rgb(3d86f0) rgb(2058d0) rgb(1a46a6) 90deg
hypr.inactive_border=rgb(9db0e0) rgb(7a90c8) 90deg
# The accent is fixed, but a custom accent (the display panel's colour
# button) replaces the middle stop of the title-bar gradient.
hypr.accent_stops=2
# XP had no glass: everything is opaque (win95 does the same), so there is
# nothing to blur. The shadow is a small, faint navy drop under each window,
# like the drop shadow XP drew under its menus.
hypr.blur=no
hypr.shadow=yes
hypr.shadow_range=10
hypr.shadow_render_power=3
hypr.shadow_color=rgba(00102860)

# XP's quick minimise / maximise and its menu fades: brisker than win95's
# calm, plainer than aero's fancy.
anim=snappy

# --- Wallpapers --------------------------------------------------------------
# make-luna-wallpaper.py --all: luna-{autumn,azure,hill,swoosh,wheat}.png,
# drawn from scratch, the same names on every monitor (logical sizes). No
# moving wallpaper.
wallpaper_prefix=luna-
wallpaper_video=

# --- libadwaita (Nautilus) ---------------------------------------------------
# prefer-DARK although the faces are cream, for win95's reason: gtk4.css sets
# every colour libadwaita varies by scheme, so a freshly started app looks the
# same under either -- but the Nautilus that is ALREADY running gets the
# scheme live and gtk.css only at its next start, and under prefer-light it
# fell straight back to stock light Adwaita, a #ffffff view on the HDR
# primary. Blue is the stock accent nearest the XP selection blue.
gtk_color_scheme=prefer-dark
gtk_accent_color=blue

# Icons: Papirus with yellow folders -- the closest open match to XP's manila
# folders (built by ~/.config/hypr/scripts/make-icon-theme.py luna). The
# light Papirus, not Papirus-Dark: its symbolic icons are dark, which suits
# the cream faces.
icon_theme=Luna

# Cursor: Catppuccin's light arrow with a dark outline -- the idea of the XP
# pointer, not its file (~/.local/share/icons/README-downloaded: source,
# GPL-2.0).
cursor_theme=catppuccin-mocha-light-cursors

# XP ran on LCDs as often as CRTs: no scanline suggestion.
crt_suggest=no

# --- Terminals (COSMIC Terminal, kitty) --------------------------------------
# The console blue of the XP-era PowerShell (2006), #012456, opaque
# (glass=0), with a palette lifted until every colour reads on it. Measured
# (WCAG) on #012456:
#   foreground #eeedf0 13.0:1, cursor #f0c040 8.9:1;
#   normal  red 5.5, green 7.9, yellow 9.0, blue 6.3, magenta 5.8, cyan 8.0,
#           white 9.4 (normal black #0c1220 is a background colour only);
#   bright  black #8b97b2 5.2 (raised from #7a86a0, which was 4.1), red 6.9,
#           green 9.9, yellow 13.1, blue 8.3, magenta 7.9, cyan 10.5,
#           white 15.1.
# Bold is drawn in the bright colours (term.bright_bold), as the console did.
term.font=Liberation Mono
term.font_size=14
term.bright_bold=yes
glass=0
term.background=#012456
term.foreground=#eeedf0
term.cursor=#f0c040
term.normal=#0c1220 #ff6b6b #5fd35f #e8c547 #6fa8ff #e07ae0 #3fd0d0 #cccccc
term.bright=#8b97b2 #ff8f8f #8ae68a #fff27a #9cc2ff #f0a0f0 #7ae8e8 #ffffff

# COSMIC apps: the console's own blue, so the terminal's title bar and its
# text area are one pane; a light XP blue as their accent (6.3:1 on the
# console blue); XP's small rounded corners.
cosmic.background=#012456
cosmic.foreground=#eeedf0
cosmic.accent=#6fa8ff
cosmic.radius=0.75

# --- Colours drawn by code ---------------------------------------------------
# Each lands on ONE kind of surface, and is chosen for it (the header above
# says why no colour can serve both the blue bar and the cream cards).
# Contrast measured on the MID pill colour #2152bc (L 0.100) and on the tray
# well #0e66b0 (L 0.127).
#
# CPU / GPU: the labels on the blue bar pills (cpu_usage.sh / gpu_usage.sh
# markup) and the sensors panel's graphs, which sit in the black Task
# Manager well. Sky 4.81:1 and XP green 4.87:1 on the pill, 12.9 and 13.0
# in the well. Neither is a status hue (aero's reasoning).
color.cpu=#b4daff
color.gpu=#a8e890
# ...except on the critical pill, a solid red #b8281e: the sky label falls to
# 4.29:1 there, white is 6.25:1 like the numbers beside it.
color.cpu_hot=#ffffff
color.gpu_hot=#ffffff
# Pending updates: the box glyph in the tray well, 3.92:1 (a glyph: >= 3).
color.pending=#ffc890
# Network graphs, drawn inside the black .ns-stats well (#0c140e): 10.4 and
# 10.6:1.
color.net_down=#7fc8ff
color.net_up=#ffb36b
# "Sure?" and the repos / updates panels' danger markup: text on the cream
# card, 4.83:1; 6.0 at a push button's top. An armed "Sure?" button stays on
# that light face (panel.css), never the sunken well (4.28) or the selection
# blue (1.72).
color.danger=#8e1c16
# wx_temp: the weather panel's 24-hour temperature graph (.wx-graph), drawn
# on the cream card -- a DrawingArea paints no CSS background, and the graph
# sits between the wells, not in one. A graph line, so >= 3:1: the XP accent
# blue, 4.87:1.
color.wx_temp=#18439a
# wx_cool / wx_warm: the low..high bar of each of the three days
# (weather_panel.py RangeBar, its two ends), which sits INSIDE the .wx-days
# sky well #1d4fae -- so they are light: sky 5.2:1, peach 5.0:1 (the same
# two colours as the low / high numbers beside them, panel.css). Dark ones
# (#18439a / #a04400) vanished on the well at ~1.2:1.
color.wx_cool=#b4daff
color.wx_warm=#ffc890
# Weather glyphs: on the bar's tray well (3.57-5.54:1) and on the weather
# panel's sky wells #1d4fae (4.55-5.76:1).
color.wx_sun=#ffd75e
color.wx_cloud=#d6e2f2
color.wx_rain=#b4daff
color.wx_storm=#d0c0ff
color.wx_snow=#f2f8ff
color.wx_moon=#e3d8ff

# --- The taskbar (scripts/dock.py, layout "taskbar"; dock.css next to this
# file draws it) --------------------------------------------------------------
# The word beside the start button's glyph: the XP taskbar's green button said
# it, in lower case (dock.css sets it bold italic). Only the word, no logo.
dock.start=start
# The Windows look is a taskbar and no top bar: with Follow the theme on
# (Settings > Dock & taskbar) this theme switches to it, and back to yours
# when you leave it.
dock.layout=taskbar
dock.top_bar=off
