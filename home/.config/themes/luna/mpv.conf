# ~/.config/themes/luna/mpv.conf -- mpv in the luna theme (theme.py copies it
# to ~/.config/mpv/theme.conf).
#
# The XP media player era, our own take: plain uosc (not aero's glass skin)
# as solid chrome -- a BAR timeline in XP's green progress-bar colour with
# dark green text on it, the menus and controls on the XP title blue with
# white text, an orange match highlight (XP's hot-track), 6px corners.
# mpv's messages and the subtitles in Tahoma (Wine's build, the theme's UI
# face): white with a blue edge, like text on an XP title bar.
# How and when the controls show, the controls row and the message /
# subtitle sizes are the same in every theme (~/.config/themes/mpv-base.conf,
# written above this file); this one sets colours, faces and shape.
#
# No theme HUD (as aero and win95 have none): uosc's own pause flash is
# enough.
#
# Contrast: the timeline's played green #62C552 against the unplayed blue
# #1C47A6 3.85:1 (a UI graphic: >= 3; XP's own #3FA83A was 2.75), the
# foreground_text #0B2A0B on that green 7.1:1; white on the blue 8.4:1;
# the error coral #FF8A7A (the bar's 'bad') on the blue 3.7:1.

# Colours are QUOTED: in mpv's config files # starts a comment, so a bare
# osd-color=#FFFFFF is an empty value (and mpv says so, and ignores it).
osc=no
osd-bar=no
scripts-append=~~/skins/uosc/uosc

# --- uosc ---------------------------------------------------------------------
script-opts-append=uosc-color=foreground=62c552,foreground_text=0b2a0b,background=1c47a6,background_text=ffffff,curtain=0c1630,success=8ae68a,error=ff8a7a,match=f0a030,heatmap=3d86f0
script-opts-append=uosc-opacity=menu=0.96,submenu=0.6,tooltip=0.96,curtain=0.7
script-opts-append=uosc-timeline_style=bar
script-opts-append=uosc-border_radius=6

# --- mpv's own messages: white on an XP title-bar edge -------------------------
osd-font=Tahoma
osd-color="#FFFFFF"
osd-border-color="#1C47A6"

# --- subtitles: bold Tahoma, a deep-blue outline --------------------------------
sub-font=Tahoma
sub-bold=yes
sub-color="#FFFFFF"
sub-border-color="#0A1E50"

# Letterbox: black, like every theme -- the bars are not part of the look.
background-color="#000000"
