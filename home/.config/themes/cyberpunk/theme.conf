# ~/.config/themes/cyberpunk/theme.conf -- the base theme: today's neon look.
#
# Every other theme inherits these values for any key it does not set
# (~/.config/hypr/scripts/theme.py explains the format and every key), so
# this file lists ALL of them -- copy the ones you want to change. The values
# are what the base files already say on their own (lua/settings.lua,
# waybar/style.css...), so this theme's stylesheets are empty: cyberpunk is
# the base, not an override of it.

name=Cyberpunk
order=10
# The root of every inherit= chain.
inherit=

# --- Accent ------------------------------------------------------------------
# Empty: the stylesheets' own @cyan (#00f0ff). The wallpaper may replace it.
accent=
accent_follow=yes

# --- Fonts -------------------------------------------------------------------
font=IBM Plex Sans
font_mono=IBM Plex Mono

# --- Hyprland look (lua/display.lua applies these at every config load) ------
hypr.rounding=4
hypr.gaps_in=3
hypr.gaps_out=4
hypr.border_size=4
# Hyprland gradient syntax: colours, then the angle.
hypr.active_border=rgb(0ff0fc) rgb(00fff7) rgb(39ff14) rgb(fffb00) rgb(ff0055) rgb(9f00ff) 135deg
hypr.inactive_border=rgba(00f0ff33) rgba(ff2a6d26) 135deg
# The wallpaper accent takes these active_border stops (1-based): the two
# cyan ones. Empty = the border never follows the accent.
hypr.accent_stops=1 2
hypr.blur=yes
hypr.blur_size=6
hypr.blur_passes=4
hypr.blur_brightness=0.80
hypr.blur_contrast=1.10
hypr.blur_vibrancy=0.30
hypr.blur_vibrancy_darkness=0.30
hypr.blur_noise=0.012
hypr.shadow=no
hypr.shadow_range=14
hypr.shadow_render_power=3
hypr.shadow_color=rgba(00f0ff55)
# The unfocused windows' shadow. Empty = none (lua/settings.lua's transparent
# rgba(00000000)): the glow belongs to the focused frame only. orchard gives
# every window a fainter drop shadow, the focused one a deeper one.
hypr.shadow_color_inactive=
# "x y" px. 0 0: no offset, a glow off the frame rather than a drop shadow
# (orchard's 0 14 hangs the shadow below the window, as a lit desk would).
hypr.shadow_offset=0 0
# The corner shape: 2 = round (Hyprland's own), higher = a squircle (orchard
# 2.6). Also a your-window-look key (hyprlook.rounding_power) in display.lua.
hypr.rounding_power=2

# Animation preset `theme.py set` switches to (snappy smooth fancy calm
# spring -- spring: the bouncy-but-smooth one orchard uses).
anim=fancy

# --- Wallpapers --------------------------------------------------------------
# make-wallpaper.py --seed 2..5, one per monitor folder, same names.
wallpaper_prefix=skyline-

# --- libadwaita (Nautilus) ---------------------------------------------------
gtk_color_scheme=prefer-dark
gtk_accent_color=blue
# Title-bar buttons of GTK / libadwaita windows (gsettings button-layout):
# words appmenu close minimize maximize icon spacer, "left:right". Stock:
# the app menu left, close right. orchard puts close,minimize,maximize left.
gtk_button_layout=appmenu:close

# Icons: Neon -- Adwaita and every app as cyan and magenta line art with a
# soft glow (built by ~/.config/hypr/scripts/make-icon-theme.py; the same
# line art as matrix's Phosphor, in the bar's two neons).
icon_theme=Neon

# The display panel may suggest the CRT screen filter (never forced).
crt_suggest=no

# --- The dynamic island (island.py), while this theme is on -----------------
# Empty = the theme leaves the island as you set it. A theme that sets them
# (orchard: yes / notch / yes) has `theme.py set` switch the island over and
# remember yours; a theme with them empty -- like this one -- gives yours
# back (theme.py island_handoff says when it does not).
#   island.enabled    yes | no
#   island.style      notch | island | glass | theme | outline
#   island.match_bar  yes | no: the bar's centre takes the island's shape
island.enabled=
island.style=
island.match_bar=

# --- The bar's layout (-> waybar/generated/bar.conf, theme-modules.json) ----
# Empty = the bar as it always was: the date and the clock in the centre,
# no logo, the workspace numbers.
#   bar.clock=menubar     the date and time at the far right, one line
#                         ("Tue 27 Oct  21:21"), the centre ones hidden
#   bar.logo=<glyph>      a glyph as the bar's first item (custom/logo);
#                         its click is the power menu, so the power pill
#                         (custom/power) hides: one power menu on the bar
#   bar.workspaces=dots   the workspaces as dots: ● active, ○ the rest
#   bar.network=icon      the network pill as the interface's glyph alone
#                         (Wi-Fi or a cable), the SSID and signal on hover
#   dock.start=<word>     a word beside the start button's glyph on the
#                         taskbar (scripts/dock.py, layout "taskbar")
#   dock.magnify=yes      the dock's icons grow under the pointer (dock.py's
#                         magnify setting, at its default "theme")
bar.clock=
bar.logo=
bar.workspaces=
bar.network=
dock.start=
dock.magnify=

# --- Terminals (COSMIC Terminal, kitty) --------------------------------------
# The bar's neon on near-black glass. Contrast is measured against the WORST
# case, the brightest blurred wallpaper (~#adadad) right behind the glass:
# at glass=12 every normal colour >= 4.6:1 there, the text 15.9:1. ANSI
# order: black red green yellow blue magenta cyan white.
term.font=IBM Plex Mono
# How see-through the terminals are, 0-100 (theme.py explains the layers);
# the display panel's "Window glass" slider overrides it per theme.
glass=12
term.font_size=14
# Bold text in the bright neon variants (COSMIC Terminal's use_bright_bold).
term.bright_bold=yes

# --- COSMIC apps (libcosmic: COSMIC Terminal's title bar, COSMIC Files...) --
# The stock COSMIC dark theme, its greys moved onto background..foreground
# and its teal onto the accent (theme.py's cosmic_colour says how).
# cosmic.radius scales its corners: 1 = stock, 0 = square.
cosmic.background=#0d1018
cosmic.foreground=#c8d3e6
cosmic.accent=#00f0ff
cosmic.radius=1

term.background=#07090f
term.foreground=#e6fcff
term.cursor=#00f0ff
term.normal=#1b1f2a #ff2a6d #39ff14 #f9f002 #5c8dff #c060ff #00f0ff #c8d3e6
term.bright=#5a6478 #ff6b96 #8aff70 #fff86b #8fb0ff #d890ff #8af8ff #ffffff

# --- Colours drawn by code, not CSS (-> waybar/generated/colors.conf) --------
# Pango markup in the bar's scripts. On the bar the CPU and GPU pills take
# their chip maker's colour instead -- NVIDIA green, AMD red, Intel blue --
# at the lightness of color.gpu below (so set it to what reads on your
# pills), the CPU a shade apart (theme.py vendor_colors); these two are the
# colours for any other maker, and the sensors panel's graphs. To change a
# maker's colour: color.amd= / color.nvidia= / color.intel=; one finished
# shade: color.cpu_amd=, color.gpu_nvidia= ...
color.cpu=#ff2a6d
color.gpu=#39ff14
# The same labels on the CRITICAL pill, which is filled with the alarm colour:
# a theme whose cpu/gpu colour vanishes on that fill names a lighter one. Left
# unset here ON PURPOSE: every theme inherits this file, and an unset key means
# "the theme's own color.cpu / color.gpu" (the scripts' fallback), where a
# value here would hand cyberpunk's pink to every theme that does not set one.
#color.cpu_hot=
#color.gpu_hot=
color.pending=#ff2a6d
# Panel graphs (cairo) and inline markup in the panels:
color.net_down=#00f0ff
color.net_up=#ff2a6d
color.danger=#ff2a6d
color.wx_temp=#00f0ff
color.wx_cool=#00f0ff
color.wx_warm=#ff2a6d
# Weather glyphs (bar pill and weather panel, wttr.py):
color.wx_sun=#f9f002
color.wx_cloud=#96d7e6
color.wx_rain=#00f0ff
color.wx_storm=#b026ff
color.wx_snow=#e6fcff
color.wx_moon=#dcb0ff
