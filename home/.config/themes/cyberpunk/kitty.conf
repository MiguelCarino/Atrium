# ~/.config/themes/cyberpunk/kitty.conf -- kitty options for the cyberpunk
# theme, appended by theme.py to ~/.config/kitty/theme.conf after the
# term.* colours (kitty reloads on SIGUSR1: open windows follow at once).

# Tabs: the bar's slanted pills. The current one a solid cyan with black text
# (15:1), the others the bar's blue-grey on near-black; shown from 2 tabs on.
tab_bar_edge top
tab_bar_style slant
tab_bar_min_tabs 2
tab_bar_background #07090f
tab_bar_margin_color #07090f
active_tab_foreground #000000
active_tab_background #00f0ff
active_tab_font_style bold
inactive_tab_foreground #96d7e6
inactive_tab_background #0d1018
inactive_tab_font_style normal
tab_title_template "{index}  {title}"

# The cursor: a cyan beam that leaves a short magenta trail when it jumps.
cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.6
cursor_trail 3
cursor_trail_decay 0.08 0.35
cursor_trail_start_threshold 4
cursor_trail_color #ff2a6d

# Links: magenta, curly underline (the "this goes somewhere" neon).
url_color #ff2a6d
url_style curly

# Splits: neon window borders, cyan on the active one.
window_border_width 1pt
active_border_color #00f0ff
inactive_border_color #1b1f2a
window_padding_width 6 8

# The bell: no sound, a short magenta flash and a magenta border.
enable_audio_bell no
visual_bell_duration 0.12
visual_bell_color #ff2a6d
bell_border_color #ff2a6d

# A thin cyan scrollbar, only while scrolled back.
scrollbar scrolled
scrollbar_handle_color #00f0ff
