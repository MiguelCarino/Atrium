# ~/.config/themes/cyberpunk/mpv.conf -- mpv in the cyberpunk theme. Copied
# to ~/.config/mpv/theme.conf by theme.py (mpv.conf includes it, before its
# first [profile]); mpv reads it at start, so it shows from the next video.
#
# A neon HUD over the picture: uosc with a solid bar timeline, cyan for
# everything that moves or is chosen, magenta only for errors; mpv's own
# messages and the subtitles in the bar's face with a faint cyan glow under
# them. Contrast: the light text #e6fcff on the #07090f panels is 18:1.

# Colours are QUOTED: in mpv's config files # starts a comment, so a bare
# osd-color=#E6FCFF is an empty value (and mpv says so, and ignores it).
osc=no
osd-bar=no
scripts-append=~~/skins/uosc/uosc
# The heads-up frame round the picture: cyan corner brackets with a glow, and
# a mono status block top-left (state, time, the stream) -- while paused, and
# for 3 s after a file opens or a seek (~/.config/mpv/skins/hud/).
scripts-append=~~/skins/hud/cyberpunk-hud.lua

# --- uosc (~/.config/mpv/skins/uosc/uosc; option names from its uosc.conf) ---
script-opts-append=uosc-color=foreground=00f0ff,foreground_text=000000,background=07090f,background_text=e6fcff,curtain=000000,success=39ff14,error=ff2a6d,match=f9f002,heatmap=c060ff
# Panels a little see-through, the bar and its position solid.
script-opts-append=uosc-opacity=timeline=0.85,position=1,chapters=0.9,slider=0.85,slider_gauge=1,controls=0,speed=0.7,menu=0.95,submenu=0.6,border=1,title=1,tooltip=0.95,thumbnail=1,curtain=0.75,idle_indicator=0.8,audio_indicator=0.6,buffering_indicator=0.4,playlist_position=0.8,heatmap=0.5,pause_indicator=0.8
# A solid bar, and a 2px progress line left over the video while the UI
# is hidden (windowed only: fullscreen is for watching).
script-opts-append=uosc-timeline_style=bar
script-opts-append=uosc-timeline_size=30
script-opts-append=uosc-timeline_border=1
script-opts-append=uosc-progress=windowed
script-opts-append=uosc-progress_size=2
script-opts-append=uosc-volume=right
script-opts-append=uosc-border_radius=2
script-opts-append=uosc-text_border=1.4
script-opts-append=uosc-animation_duration=110
script-opts-append=uosc-pause_indicator=flash
# The HUD says PAUSED and draws its frame, so uosc's own centre pause sign
# would only say it twice: it flashes once and goes.
script-opts-append=uosc-flash_duration=700
# The top bar in no-border mode: the title in the panel near-black with the
# window buttons, appearing with the controls -- the HUD's partner at the top.
script-opts-append=uosc-top_bar=no-border
script-opts-append=uosc-top_bar_title=yes
# Chapters and the "heatmap" of most-watched parts drawn on the timeline;
# opening / ending chapter ranges in the two neons, ads in the capture red.
script-opts-append=uosc-timeline_heatmap=overlay
script-opts-append=uosc-chapter_ranges=openings:00f0ff50,endings:ff2a6d50,ads:ff143c80
# A sharper UI: icons and text at 0.95 with the outline above.
script-opts-append=uosc-font_scale=0.95

# --- mpv's own messages (seek, volume, "Paused"...) -------------------------
osd-font=IBM Plex Sans
osd-color="#E6FCFF"
osd-border-color="#07090F"
osd-border-size=2
osd-shadow-offset=1
osd-shadow-color="#8000F0FF"
osd-font-size=30
# Messages in the HUD's corner, not the middle of the picture.
osd-align-x=right
osd-align-y=top
osd-margin-x=40
osd-margin-y=36
# --- subtitles (text ones; .ass files keep their own styles) ----------------
sub-font=IBM Plex Sans SemiBold
sub-font-size=44
sub-color="#E6FCFF"
sub-border-color="#07090F"
sub-border-size=2.6
sub-shadow-offset=1.5
sub-shadow-color="#6600F0FF"
# Letterbox: black, like every theme -- the bars are not part of the look.
background-color="#000000"