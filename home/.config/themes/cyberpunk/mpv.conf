# ~/.config/themes/cyberpunk/mpv.conf -- mpv in the cyberpunk theme. Copied
# to ~/.config/mpv/theme.conf by theme.py (mpv.conf includes it, before its
# first [profile]); mpv reads it at start, so it shows from the next video.
#
# Neon, kept off the picture: uosc in cyan for everything that moves or is
# chosen, magenta only for errors, on near-black panels; mpv's messages and
# the subtitles in the bar's face. Contrast: the light text #e6fcff on the
# #07090f panels is 18:1.
# How and when the controls show, the controls row and the message /
# subtitle sizes are the same in every theme (~/.config/themes/mpv-base.conf,
# written above this file); this one sets colours, faces and shape.

# Colours are QUOTED: in mpv's config files # starts a comment, so a bare
# osd-color=#E6FCFF is an empty value (and mpv says so, and ignores it).
osc=no
osd-bar=no
scripts-append=~~/skins/uosc/uosc
# While paused (after 0.6 s): thin cyan corner brackets and a small mono
# status block top-left -- the time and the stream (~/.config/mpv/skins/hud/).
# Nothing over playing video.
scripts-append=~~/skins/hud/cyberpunk-hud.lua

# --- uosc (~/.config/mpv/skins/uosc/uosc; option names from its uosc.conf) ---
script-opts-append=uosc-color=foreground=00f0ff,foreground_text=000000,background=07090f,background_text=e6fcff,curtain=000000,success=39ff14,error=ff2a6d,match=f9f002,heatmap=c060ff
# Panels a little see-through, the timeline and its position solid.
script-opts-append=uosc-opacity=timeline=0.85,position=1,chapters=0.9,slider=0.85,slider_gauge=1,controls=0,speed=0.7,menu=0.95,submenu=0.6,border=1,title=1,tooltip=0.95,thumbnail=1,curtain=0.75,idle_indicator=0.8,audio_indicator=0.6,buffering_indicator=0.4,playlist_position=0.8,heatmap=0.5,pause_indicator=0.8
script-opts-append=uosc-border_radius=2
script-opts-append=uosc-text_border=1.4
script-opts-append=uosc-animation_duration=110
# Opening / ending chapter ranges in the two neons, ads in the capture red.
script-opts-append=uosc-chapter_ranges=openings:00f0ff50,endings:ff2a6d50,ads:ff143c80
# A sharper UI: icons and text at 0.95 with the outline above.
script-opts-append=uosc-font_scale=0.95

# --- mpv's own messages (seek, volume, screenshot...) -----------------------
osd-font=IBM Plex Sans
osd-color="#E6FCFF"
osd-border-color="#07090F"

# --- subtitles (text ones; .ass files keep their own styles) ----------------
sub-font=IBM Plex Sans SemiBold
sub-color="#E6FCFF"
sub-border-color="#07090F"

# Letterbox: black, like every theme -- the bars are not part of the look.
background-color="#000000"
