# ~/.config/themes/moe/theme.conf -- 萌え / moe: a pastel sakura desktop.
# Soft pink, lavender and peach GLASS bubbles with deep plum text, round
# everything, the rounded Japanese faces (M PLUS Rounded 1c, Hachi Maru Pop
# for headings), Japanese where the desktop speaks (the day in the bar, kanji
# workspace numbers, the launcher's prompt), sakura wallpapers drawn by
# make-moe-wallpaper.py and petals that fall (make-moe-sakura.py).
#
# Inherits cyberpunk for every key not set here (theme.py explains the
# format). The files next to this one do the rest: waybar.css, panel.css,
# launcher.css, wofi.css, mako, gtk4.css (Nautilus), hypr.lua, kitty.conf,
# prompt.sh, mpv.conf.
#
# The rules this theme keeps:
#   * LIGHT, but dimmed: the primary can be HDR, so no surface is near white. The bar's
#     pills are #e8c4d6 glass (luminance 0.61), the cards #dcb6c9 (0.53) --
#     between win95's #acacac face and true pastel. Text on them is the deep
#     plum #3d1f3b (9.1:1 on a pill, 7.9:1 on a card), dim text #63365a
#     (6.0 / 5.2);
#   * the PASTELS are fills, never text: sakura #f78fb3, lavender #b8a4e3,
#     sky #9fd3f5, mint #9fdcb8, lemon #f3d27a carry plum text (6.5-9.8:1).
#     As text on the pastel glass each has a deep twin (rose #8c2457,
#     violet #55399a, ...: >= 4.5:1 on a pill), which the color.* keys below
#     and the stylesheets use;
#   * status is a FILL, as in win95 (a light hue cannot be both a colour and
#     readable text on pastel): good mint, warn lemon, bad rose -- all with
#     plum text -- and critical a deep rose #d63a62 with white (4.5:1);
#   * the ACCENT ROLE (@cyan in every base stylesheet, mako's border) is the
#     deep rose #8c2457, not the sakura pastel: the base files use it as
#     TEXT too (lit glyphs, headings, the calendar), and sakura as text on
#     pastel glass is 1.3:1; deep rose is 5.3:1 there, and white on it as a
#     fill 7.9:1. The sakura pastel is set explicitly where it is a fill or a
#     glow (workspaces, hover, switches, sliders, the window frame). Fixed
#     (accent_follow=no): a wallpaper pick would drag in sky or lavender.

name=萌え Moe
order=50

# --- Accent ------------------------------------------------------------------
accent=#8c2457
accent_follow=no

# --- Language ----------------------------------------------------------------
# ja: the bar's day reads 10月18日 (日) and the workspaces 一 二 三...; the
# launcher's prompt is Japanese. (theme.py: lang= -- en is every other theme.)
lang=ja

# --- Fonts -------------------------------------------------------------------
# Rounded Mplus 1c (M PLUS Rounded 1c, OFL): a rounded gothic with full
# Japanese, so kana and kanji match the Latin; IBM Plex Sans after it for
# symbols it lacks. ~/.local/share/fonts/themes/moe/README has the sources.
font=Rounded Mplus 1c, IBM Plex Sans
font_mono=M PLUS 1 Code, IBM Plex Mono

# --- Hyprland look -----------------------------------------------------------
# Round, airy, a sakura -> lavender -> sky frame on the focused window and a
# soft pink shadow under everything; blur lighter than cyberpunk's (the glass
# is pastel, a heavy frost would wash it grey).
hypr.rounding=14
hypr.gaps_in=5
hypr.gaps_out=10
hypr.border_size=3
hypr.active_border=rgb(f78fb3) rgb(b8a4e3) rgb(9fd3f5) 45deg
hypr.inactive_border=rgba(e8c4d688) rgba(c9b8e888) 45deg
# The accent is fixed; nothing to replace in the border.
hypr.accent_stops=
hypr.blur=yes
hypr.blur_size=7
hypr.blur_passes=3
hypr.blur_brightness=0.86
hypr.blur_contrast=0.92
hypr.blur_vibrancy=0.35
hypr.blur_vibrancy_darkness=0.10
hypr.blur_noise=0.010
hypr.shadow=yes
hypr.shadow_range=22
hypr.shadow_render_power=3
hypr.shadow_color=rgba(c8508a66)

# Bouncy: windows pop in with a little overshoot.
anim=fancy

# --- Wallpapers --------------------------------------------------------------
# make-moe-wallpaper.py --all: moe-sakura-day, moe-fuji, moe-yozakura,
# moe-kawaii on all three monitors; make-moe-sakura.py --all renders the
# falling petals (the slideshow plays them over the still; the display
# panel's "Moving wallpaper" switch turns them off).
wallpaper_prefix=moe-
wallpaper_video=moe-sakura.mp4

# --- libadwaita (Nautilus) ---------------------------------------------------
# prefer-dark with every colour set by gtk4.css, as win95 does: under
# prefer-light a running Nautilus drops to stock white until restarted -- a
# #ffffff field on the HDR panel.
gtk_color_scheme=prefer-dark
gtk_accent_color=pink

# Icons: Papirus with pink folders (make-icon-theme.py moe builds the folder
# links; Papirus itself is in ~/.local/share/icons, README-downloaded).
icon_theme=Moe

crt_suggest=no

# The pointer: Catppuccin Mocha pink (GPL-2.0, ~/.local/share/icons; README-
# downloaded there) -- a light pink arrow with a dark outline, so it shows on
# pastel and on the night plum alike.
cursor_theme=catppuccin-mocha-pink-cursors

# --- Terminals (COSMIC Terminal, kitty) --------------------------------------
# Sakura at night: plum glass, pastel ink -- easier on the eyes than a light
# terminal, and kind to the HDR panel. Text 12.4:1; every normal colour
# >= 6.5:1, bright black (dim hints) 4.9:1. M PLUS 1 Code: monospace with
# Japanese (static Regular / Bold cut from the variable font -- COSMIC
# Terminal lists a family only with both).
term.font=M PLUS 1 Code
term.font_size=15
glass=14
term.bright_bold=no
term.background=#2b1d2e
term.foreground=#f6dce8
term.cursor=#f78fb3
term.normal=#3d2b40 #ff7a9c #9be6b4 #ffd98a #9fc4f5 #d8a6f0 #8fe3e0 #e6cfdc
term.bright=#a2879f #ff9db5 #b8f0cc #ffe7ad #bcd6fa #e6c0f5 #b0efec #fff0f7

# --- COSMIC apps (the terminal's title bar...) -------------------------------
cosmic.background=#2b1d2e
cosmic.foreground=#f6dce8
cosmic.accent=#f78fb3
cosmic.radius=1.5

# --- Colours drawn by code ---------------------------------------------------
# On the pastel pills: the deep twins (>= 4.5:1 there); white on the critical
# rose fill.
color.cpu=#8c2457
color.gpu=#55399a
color.cpu_hot=#ffffff
color.gpu_hot=#ffffff
color.pending=#55399a
color.net_down=#1f5a94
color.net_up=#8c2457
color.danger=#94163a
color.wx_temp=#8c2457
color.wx_cool=#1f5a94
color.wx_warm=#8c2457
color.wx_sun=#6e4800
color.wx_cloud=#5a4a60
color.wx_rain=#1f5a94
color.wx_storm=#55399a
color.wx_snow=#3d5d75
color.wx_moon=#4a3a7a

# --- The bar ----------------------------------------------------------------
# The network pill as the interface's glyph alone (Wi-Fi or a cable), the
# SSID and signal on hover ("Available" while offline with networks in
# range): no "Wi-Fi (70%)".
bar.network=icon

# --- The dock and the taskbar (scripts/dock.py; dock.css next to this file
# draws both) ------------------------------------------------------------------
# The word beside the taskbar's start glyph: the start button in the theme's language.
dock.start=スタート
