# ~/.config/themes/moe/mpv.conf -- mpv in the moe theme (theme.py copies it to
# ~/.config/mpv/theme.conf).
#
# Pastel sakura, kept off the picture: uosc in the sakura pastel with plum
# text, everything rounded, a little bounce; moe-hud.lua's one small bubble
# (一時停止中 ♡, only while paused) in Hachi Maru Pop; messages and subtitles
# soft white with a deep-rose outline.
# How and when the controls show, the controls row and the message /
# subtitle sizes are the same in every theme (~/.config/themes/mpv-base.conf,
# written above this file); this one sets colours, faces and shape.
#
# Colours are QUOTED: in mpv's config files # starts a comment.

osc=no
osd-bar=no
scripts-append=~~/skins/uosc/uosc
scripts-append=~~/skins/hud/moe-hud.lua

# --- uosc ---------------------------------------------------------------------
# foreground: the sakura pastel (bars, the chosen item) under plum text 6.5:1;
# background: the bar's pastel glass under plum 9.1:1.
script-opts-append=uosc-color=foreground=f78fb3,foreground_text=3d1f3b,background=e8c4d6,background_text=3d1f3b,curtain=2b1d2e,success=9fdcb8,error=d63a62,match=b8a4e3,heatmap=f78fb3
script-opts-append=uosc-opacity=timeline=0.92,position=1,chapters=0.9,slider=0.92,slider_gauge=1,controls=0,speed=0.8,menu=0.96,submenu=0.6,border=1,title=1,tooltip=0.96,thumbnail=1,curtain=0.7,idle_indicator=0.8,audio_indicator=0.6,buffering_indicator=0.4,playlist_position=0.9,heatmap=0.5,pause_indicator=0.8
script-opts-append=uosc-border_radius=12
script-opts-append=uosc-text_border=1.2
# A soft bounce, not cyberpunk's snap.
script-opts-append=uosc-animation_duration=180
# No uosc top bar (the base shows it on hover): in this palette it drew its
# pastel box with no text in it.
script-opts-append=uosc-top_bar=never
script-opts-append=uosc-chapter_ranges=openings:f78fb360,endings:b8a4e360,ads:d63a6280

# --- mpv's own messages ---------------------------------------------------------
osd-font=Rounded Mplus 1c
# Outlined like the subtitles, not opaque-box: that style drew an empty
# pastel box in the top-left corner whenever no message was up.
osd-color="#FFF0F7"
osd-border-color="#8C2457"

# --- subtitles ----------------------------------------------------------------------
sub-font=Rounded Mplus 1c
sub-bold=yes
sub-color="#FFF0F7"
sub-border-color="#8C2457"

# Letterbox: black, like every theme -- the bars are not part of the look.
background-color="#000000"
