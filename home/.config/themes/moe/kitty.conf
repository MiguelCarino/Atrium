# ~/.config/themes/moe/kitty.conf -- kitty options for the moe theme, appended
# by theme.py to ~/.config/kitty/theme.conf after the term.* colours.

# Tabs: round "powerline" bubbles; the current one sakura with plum text
# (6.5:1) and a ✿, the others plum glass with the pastel ink.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_bar_background #2b1d2e
tab_bar_margin_color #2b1d2e
active_tab_foreground #3d1f3b
active_tab_background #f78fb3
active_tab_font_style bold
inactive_tab_foreground #e6cfdc
inactive_tab_background #3d2b40
inactive_tab_font_style normal
tab_title_template "{index} {title}"
active_tab_title_template "✿ {title}"

# The cursor: a sakura beam with a lavender trail when it jumps.
cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.7
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 3
cursor_trail_color #b8a4e3

# Links: pink, curly underline.
url_color #ff9db5
url_style curly

# Room to breathe; splits with a soft sakura border on the active one.
window_padding_width 10 12
window_border_width 1pt
active_border_color #f78fb3
inactive_border_color #3d2b40

# The bell: a soft pink blink, no sound.
enable_audio_bell no
visual_bell_duration 0.15
visual_bell_color #f78fb3
bell_border_color #f78fb3

scrollbar scrolled
scrollbar_handle_color #f78fb3
