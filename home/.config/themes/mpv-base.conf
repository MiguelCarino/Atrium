# ~/.config/themes/mpv-base.conf -- how mpv's on-screen interface BEHAVES,
# the same in every theme. theme.py writes it into ~/.config/mpv/theme.conf
# ABOVE the current theme's mpv.conf, so a theme can still override a line
# (a later script-opts entry for the same key wins), and Settings > Theme >
# Video player's presets (controls.conf) come after both.
#
# The rule: the picture is the point. Nothing is drawn over playing video
# unless the pointer asks for it, a message is short and small, and every
# theme shares the same layout, so a theme changes the COLOURS and the FACE,
# not where things are or when they show. Themes keep: uosc-color/opacity,
# border_radius, text_border, font_scale, animation_duration, timeline_style
# (win95 and luna draw a bar), chapter_ranges, and mpv's osd-/sub- font and
# colours.

# --- uosc: when things show ----------------------------------------------------
# No progress line left over the picture once the controls hide (uosc's
# default draws a 2 px one in a window): it is the one thing that sat on
# playing video all the time.
script-opts-append=uosc-progress=never
# The timeline is a thin line that grows under the pointer, and stays up
# while paused (paused is when you look for the position); otherwise only
# within reach of the pointer.
script-opts-append=uosc-timeline_style=line
script-opts-append=uosc-timeline_line_width=3
script-opts-append=uosc-timeline_size=30
script-opts-append=uosc-timeline_border=1
script-opts-append=uosc-timeline_persistency=paused
# Show a little earlier when the pointer heads for the edge, hide soon after
# it leaves.
script-opts-append=uosc-proximity_in=50
script-opts-append=uosc-proximity_out=110
# The title bar only on hover at the top -- no flash of the title over the
# opening seconds of every file.
script-opts-append=uosc-top_bar=no-border
script-opts-append=uosc-top_bar_flash_on=
# Pause: one short, quiet flash of the centre sign, never a sign left over
# the frame you paused to look at.
script-opts-append=uosc-pause_indicator=flash
script-opts-append=uosc-flash_duration=450

# --- uosc: what the controls row holds ---------------------------------------
# Three groups, all hidden with the rest of the controls until the pointer
# comes near (so more buttons cost the picture nothing):
#   left    the menu, then the pickers, each only when it has something to
#           offer: subtitles, audio / video / edition when there is a choice,
#           stream quality for streams, chapters when there are any;
#   middle  previous / playlist / next, only with a playlist;
#   corner  the playback tools, bottom right next to the volume:
#             speed      uosc's speed dial (drag or scroll it; click resets)
#             A-B loop   1st click marks A, 2nd marks B and loops, 3rd clears
#                        (mpv's ab-loop; its message says which step)
#             loop file  repeat this file (lit while on)
#             shuffle    only with a playlist
#             screenshot the frame, to ~/Pictures/Screenshots (mpv.conf),
#                        subtitles included as you see them
#             deband     for banding in dark gradients (anime skies); off by
#                        default, see mpv.conf's note (lit while on)
#             stats      mpv's overlay: codec, decoder, dropped frames, HDR
#             audio out  pick the output device without leaving mpv
#           then fullscreen.
# Every button has a tooltip. A button's command may not contain ':' or ','
# (uosc splits the list on them), which is why aspect ratio is not here.
script-opts-append=uosc-controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,<has_chapter>chapters,space,<has_playlist>prev,<has_playlist>items,<has_playlist>next,space,<video,audio>speed:1.3,gap:0.5,<video,audio>command:sync_alt:ab-loop?A-B loop,<video,audio>loop-file,<has_playlist>shuffle,gap:0.5,<video>command:photo_camera:screenshot?Screenshot,<video>toggle:gradient:deband?Deband,command:query_stats:script-binding stats/display-stats-toggle?Stats,audio-device,gap,fullscreen
script-opts-append=uosc-controls_size=30
script-opts-append=uosc-volume=right
script-opts-append=uosc-volume_size=36
# uosc scales up 1.3x in fullscreen by default; on the 3440x1440 panel that
# made the controls the size of a TV remote's. A little bigger than windowed
# is enough.
script-opts-append=uosc-scale_fullscreen=1.15
# The end of the timeline says when the film ends, not how long is left
# in a counter that keeps moving.
script-opts-append=uosc-destination_time=total

# --- mpv's own messages (seek, volume, "Paused", screenshot...) ----------------
# Small, top left, gone in under a second, with a soft dark edge that reads
# on any picture -- never a coloured glow.
osd-font-size=24
osd-duration=900
osd-align-x=left
osd-align-y=top
osd-margin-x=32
osd-margin-y=28
osd-border-style=outline-and-shadow
osd-border-size=1.6
osd-shadow-offset=1
osd-shadow-color="#80000000"

# --- subtitles (text ones; .ass files keep their own styles) ----------------
# Streaming-service sizing: a little smaller than most themes had (44-46),
# a thin dark edge plus a soft neutral shadow, and lifted off the very bottom.
# Themes choose the face and the colours; they do not add glows.
sub-font-size=40
sub-border-size=2.2
sub-shadow-offset=1
sub-shadow-color="#80000000"
sub-blur=0.2
sub-margin-y=34
