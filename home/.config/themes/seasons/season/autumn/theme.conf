color.cpu=#ee9a62
color.pending=#ee9a62
color.net_down=#ee9a62
color.wx_temp=#ee9a62
# GPU #a9bfd8 (9.8 / 9.7, dE 28.8 from good).
color.gpu=#a9bfd8
# On the critical fill #8a1c30: the readout (8.1:1 there).
color.cpu_hot=#f8efe3
color.gpu_hot=#f8efe3
# Net-up and the warm end of the day range: #c8b8a0 (9.5 / 9.4, dE 19.8 from warn).
color.net_up=#c8b8a0
color.wx_warm=#c8b8a0
