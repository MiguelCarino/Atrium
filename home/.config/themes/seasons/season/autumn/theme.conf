# storm #c9a2d8 (8.5 / 8.4); snow the readout (16.2 / 16.1); moon #d6dcf0 (13.5 / 13.4).
color.wx_cool=#a9bfd8
color.wx_rain=#a9bfd8
color.wx_sun=#f0dfb8
color.wx_cloud=#c8bcae
color.wx_storm=#c9a2d8
