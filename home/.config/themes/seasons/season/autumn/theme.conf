# ~/.config/themes/seasons/season/autumn/theme.conf -- the autumn overlay.
# Autumn: amber and rust. The accent is copper; amber cannot be the
# accent role (it would read as warn), so warn is a pale straw instead and
# copper keeps 26.5 dE from it.
#
# theme.py lays this over seasons/theme.conf while autumn is the season (the
# date and your hemisphere, or a pin; theme.py's "Seasonal themes" says how).
# Only colours and the sets that carry them may be set here (SEASON_KEYS and
# color.*); `theme.py check seasons` reports anything else, which stays the
# theme's all year. The stylesheet colours are in palette.css beside this.

accent=#ee9a62
gtk_accent_color=orange
icon_theme=Seasons-Autumn
wallpaper_prefix=seasons-autumn-

# --- Terminals ---------------------------------------------------------------
# The floor #110b07 (luminance 0.0037). Measured (WCAG) on it:
#   foreground #f1e3d0 15.5:1, cursor #ee9a62 8.8:1;
#   normal  red 6.3, green 10.7, yellow 13.7, blue 10.4, magenta 9.0, cyan 9.8, white 11.2
#           (normal black #281a11 is a background colour only, 1.2);
#   bright  black 5.1, red 7.5, green 13.0, yellow 15.2, blue 13.0, magenta 11.9, cyan 12.8, white 17.2
#           (bright black: hints, autosuggestions, comments).
# At the theme's glass 12 over theme.py's worst case (#adadad behind):
# text 13.0:1, the dimmest colour 5.26:1 -- every colour >= 4.5 up to
# glass 19; readable_glass() would allow 37. 12 is kept.
term.background=#110b07
term.foreground=#f1e3d0
term.cursor=#ee9a62
term.normal=#281a11 #f2607a #86d0a0 #f0d85c #a9bfd8 #c9a2d8 #7cc4c0 #d0c2b0
term.bright=#90806e #f47a90 #a8e0b8 #f6e488 #c4d4e8 #dcc0e8 #a0dcd8 #f8efe3

# --- COSMIC apps -------------------------------------------------------------
cosmic.background=#110b07
cosmic.foreground=#f1e3d0
cosmic.accent=#ee9a62

# --- Colours drawn by code ---------------------------------------------------
# On the opaque pill #1b120c / the card #1c130d (contrast), and the nearest status
# where it matters (CIEDE2000).
