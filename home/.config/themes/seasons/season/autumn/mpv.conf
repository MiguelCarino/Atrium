# ~/.config/themes/seasons/season/autumn/mpv.conf -- mpv's colours in
# autumn. theme.py appends it after ../../mpv.conf (shape, faces, behaviour):
# a later script-opts-append of the same uosc key wins, as mpv-base.conf
# relies on, so these lines only colour. Colours QUOTED where mpv wants a
# "#": in mpv's config files # starts a comment; uosc takes bare hex.
#
# Contrast, WCAG: foreground_text ink #1c0d04 on the copper accent
# #ee9a62 8.5; background_text #f1e3d0 on the surface #1b120c
# 14.6; the played accent line against the surface 8.3 (a UI
# graphic, >= 3). success= is the good #86d0a0 (10.1 on the surface), error= the
# bad #e9506e, drawn as text on the surface (5.1) AND as the Updater's
# button fill under the ink (5.3). match= is the readout #f8efe3, bold:
# 16.2 on normal rows, 2.0 on the active (accent) row -- the limit every theme
# notes; no one colour reads on both. Messages and subtitles: the readout
# (never white) with a floor-coloured outline (17.2).
script-opts-append=uosc-color=foreground=ee9a62,foreground_text=1c0d04,background=1b120c,background_text=f1e3d0,curtain=110b07,success=86d0a0,error=e9506e,match=f8efe3,heatmap=ee9a62
script-opts-append=uosc-chapter_ranges=openings:ee9a6260,endings:64462c80,ads:e9506e80
osd-color="#F8EFE3"
osd-border-color="#110B07"
sub-color="#F8EFE3"
sub-border-color="#110B07"
