# ~/.config/themes/seasons/season/autumn/kitty.conf -- kitty's season
# colours, appended by theme.py after ../../kitty.conf (layout only) -- a
# later kitty option wins. The terminal palette itself is term.* in
# theme.conf here.
#
# Contrast, WCAG, on the floor #110b07: the current tab, ink #1c0d04 on the accent
# #ee9a62 8.5; the others, text #f1e3d0 on the raised plate #281a11 13.4;
# links in the season's first hue #a9bfd8 10.4; the active split border (accent)
# 8.8, the others the hairline #45301f (decoration); the bell rim in
# the warn colour #f0d85c 13.7 -- a bell is "look here", not a fault -- over
# a raised-plate blink (no light flash on the HDR panel); the scrollbar
# handle #64462c 2.3 (it only shows while scrolled).
tab_bar_background #110b07
tab_bar_margin_color #110b07
active_tab_foreground #1c0d04
active_tab_background #ee9a62
inactive_tab_foreground #f1e3d0
inactive_tab_background #281a11
url_color #a9bfd8
active_border_color #ee9a62
inactive_border_color #45301f
visual_bell_color #281a11
bell_border_color #f0d85c
scrollbar_handle_color #64462c
