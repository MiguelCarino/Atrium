# ~/.config/themes/seasons/season/winter/mpv.conf -- mpv's colours in
# winter. theme.py appends it after ../../mpv.conf (shape, faces, behaviour):
# a later script-opts-append of the same uosc key wins, as mpv-base.conf
# relies on, so these lines only colour. Colours QUOTED where mpv wants a
# "#": in mpv's config files # starts a comment; uosc takes bare hex.
#
# Contrast, WCAG: foreground_text ink #06111c on the frost accent
# #8ccaf2 10.7; background_text #e4ebf4 on the surface #0e141e
# 15.4; the played accent line against the surface 10.4 (a UI
# graphic, >= 3). success= is the good #6fd8a2 (10.6 on the surface), error= the
# bad #f26a7c, drawn as text on the surface (6.3) AND as the Updater's
# button fill under the ink (6.5). match= is the readout #f1f5fa, bold:
# 16.9 on normal rows, 1.6 on the active (accent) row -- the limit every theme
# notes; no one colour reads on both. Messages and subtitles: the readout
# (never white) with a floor-coloured outline (18.0).
script-opts-append=uosc-color=foreground=8ccaf2,foreground_text=06111c,background=0e141e,background_text=e4ebf4,curtain=070b11,success=6fd8a2,error=f26a7c,match=f1f5fa,heatmap=8ccaf2
script-opts-append=uosc-chapter_ranges=openings:8ccaf260,endings:41567880,ads:f26a7c80
osd-color="#F1F5FA"
osd-border-color="#070B11"
sub-color="#F1F5FA"
sub-border-color="#070B11"
