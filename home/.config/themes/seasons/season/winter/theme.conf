# ~/.config/themes/seasons/season/winter/theme.conf -- the winter overlay.
# Winter: frost blue and silver. The accent is frost blue; silver is the
# first hue, a warm ember the third (net-up, night light).
#
# theme.py lays this over seasons/theme.conf while winter is the season (the
# date and your hemisphere, or a pin; theme.py's "Seasonal themes" says how).
# Only colours and the sets that carry them may be set here (SEASON_KEYS and
# color.*); `theme.py check seasons` reports anything else, which stays the
# theme's all year. The stylesheet colours are in palette.css beside this.

accent=#8ccaf2
gtk_accent_color=blue
icon_theme=Seasons-Winter
wallpaper_prefix=seasons-winter-

# --- Terminals ---------------------------------------------------------------
# The floor #070b11 (luminance 0.0032). Measured (WCAG) on it:
#   foreground #e4ebf4 16.4:1, cursor #8ccaf2 11.1:1;
#   normal  red 6.7, green 11.3, yellow 12.0, blue 11.1, magenta 9.3, cyan 12.0, white 12.2
#           (normal black #172030 is a background colour only, 1.2);
#   bright  black 5.6, red 8.8, green 13.5, yellow 14.0, blue 13.6, magenta 12.1, cyan 14.3, white 18.0
#           (bright black: hints, autosuggestions, comments).
# At the theme's glass 12 over theme.py's worst case (#adadad behind):
# text 13.9:1, the dimmest colour 5.65:1 -- every colour >= 4.5 up to
# glass 22; readable_glass() would allow 39. 12 is kept.
term.background=#070b11
term.foreground=#e4ebf4
term.cursor=#8ccaf2
term.normal=#172030 #f26a7c #6fd8a2 #f1c45c #8ccaf2 #b9a8f0 #7fd8e0 #c4ccd8
term.bright=#7d8aa0 #ff8a98 #98e6bc #f6d68a #b4dcf8 #d0c4f6 #a8e6ec #f1f5fa

# --- COSMIC apps -------------------------------------------------------------
cosmic.background=#070b11
cosmic.foreground=#e4ebf4
cosmic.accent=#8ccaf2

# --- Colours drawn by code ---------------------------------------------------
# On the opaque pill #0e141e / the card #0f1520 (contrast), and the nearest status
# where it matters (CIEDE2000).
# CPU, pending, net-down and the temperature graph: the accent (10.4 / 10.3).
color.cpu=#8ccaf2
color.pending=#8ccaf2
color.net_down=#8ccaf2
color.wx_temp=#8ccaf2
# GPU #b9a8f0 (8.7 / 8.6, dE 30.2 from bad).
color.gpu=#b9a8f0
# On the critical fill #8c1f30: the readout (8.1:1 there).
color.cpu_hot=#f1f5fa
color.gpu_hot=#f1f5fa
# Net-up and the warm end of the day range: #e6cdb8 (12.1 / 12.0, dE 17.6 from warn).
color.net_up=#e6cdb8
color.wx_warm=#e6cdb8
# Danger markup: bad as small text (8.2 / 8.1).
color.danger=#ff8a98
# Weather: cool end and rain #8ccaf2 (10.4 / 10.3); the sun is the
# epoch #eee6c8 (14.8 / 14.6, dE 17.7 from warn); cloud #b8c4d4 (10.4 / 10.3);
# storm #b9a8f0 (8.7 / 8.6); snow the readout (16.9 / 16.7); moon #d6dcf0 (13.5 / 13.4).
color.wx_cool=#8ccaf2
color.wx_rain=#8ccaf2
color.wx_sun=#eee6c8
color.wx_cloud=#b8c4d4
color.wx_storm=#b9a8f0
color.wx_snow=#f1f5fa
color.wx_moon=#d6dcf0
