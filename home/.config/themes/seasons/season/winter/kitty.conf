# ~/.config/themes/seasons/season/winter/kitty.conf -- kitty's season
# colours, appended by theme.py after ../../kitty.conf (layout only) -- a
# later kitty option wins. The terminal palette itself is term.* in
# theme.conf here.
#
# Contrast, WCAG, on the floor #070b11: the current tab, ink #06111c on the accent
# #8ccaf2 10.7; the others, text #e4ebf4 on the raised plate #172030 13.6;
# links in the season's first hue #c4ccd8 12.2; the active split border (accent)
# 11.1, the others the hairline #2a384e (decoration); the bell rim in
# the warn colour #f1c45c 12.0 -- a bell is "look here", not a fault -- over
# a raised-plate blink (no light flash on the HDR panel); the scrollbar
# handle #415678 2.7 (it only shows while scrolled).
tab_bar_background #070b11
tab_bar_margin_color #070b11
active_tab_foreground #06111c
active_tab_background #8ccaf2
inactive_tab_foreground #e4ebf4
inactive_tab_background #172030
url_color #c4ccd8
active_border_color #8ccaf2
inactive_border_color #2a384e
visual_bell_color #172030
bell_border_color #f1c45c
scrollbar_handle_color #415678
