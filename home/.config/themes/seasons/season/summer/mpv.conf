# ~/.config/themes/seasons/season/summer/mpv.conf -- mpv's colours in
# summer. theme.py appends it after ../../mpv.conf (shape, faces, behaviour):
# a later script-opts-append of the same uosc key wins, as mpv-base.conf
# relies on, so these lines only colour. Colours QUOTED where mpv wants a
# "#": in mpv's config files # starts a comment; uosc takes bare hex.
#
# Contrast, WCAG: foreground_text ink #05140f on the lagoon accent
# #5ccfd6 10.2; background_text #e8efda on the surface #0b1a13
# 15.2; the played accent line against the surface 9.7 (a UI
# graphic, >= 3). success= is the good #a3d65c (10.5 on the surface), error= the
# bad #ff5c80, drawn as text on the surface (6.1) AND as the Updater's
# button fill under the ink (6.4). match= is the readout #f3f6ea, bold:
# 16.4 on normal rows, 1.7 on the active (accent) row -- the limit every theme
# notes; no one colour reads on both. Messages and subtitles: the readout
# (never white) with a floor-coloured outline (17.5).
script-opts-append=uosc-color=foreground=5ccfd6,foreground_text=05140f,background=0b1a13,background_text=e8efda,curtain=06110c,success=a3d65c,error=ff5c80,match=f3f6ea,heatmap=5ccfd6
script-opts-append=uosc-chapter_ranges=openings:5ccfd660,endings:335c4580,ads:ff5c8080
osd-color="#F3F6EA"
osd-border-color="#06110C"
sub-color="#F3F6EA"
sub-border-color="#06110C"
