# ~/.config/themes/seasons/season/summer/kitty.conf -- kitty's season
# colours, appended by theme.py after ../../kitty.conf (layout only) -- a
# later kitty option wins. The terminal palette itself is term.* in
# theme.conf here.
#
# Contrast, WCAG, on the floor #06110c: the current tab, ink #05140f on the accent
# #5ccfd6 10.2; the others, text #e8efda on the raised plate #12261c 13.5;
# links in the season's first hue #9fc2ff 10.6; the active split border (accent)
# 10.4, the others the hairline #21402f (decoration); the bell rim in
# the warn colour #ff9f45 9.4 -- a bell is "look here", not a fault -- over
# a raised-plate blink (no light flash on the HDR panel); the scrollbar
# handle #335c45 2.5 (it only shows while scrolled).
tab_bar_background #06110c
tab_bar_margin_color #06110c
active_tab_foreground #05140f
active_tab_background #5ccfd6
inactive_tab_foreground #e8efda
inactive_tab_background #12261c
url_color #9fc2ff
active_border_color #5ccfd6
inactive_border_color #21402f
visual_bell_color #12261c
bell_border_color #ff9f45
scrollbar_handle_color #335c45
