# ~/.config/themes/seasons/season/summer/theme.conf -- the summer overlay.
# Summer: deep green and sun gold. The accent is lagoon teal; sun gold
# cannot be the accent role (it would read as the orange warn), so it is
# the second hue (headings, the epoch, net-up), 20.5 dE from warn.
#
# theme.py lays this over seasons/theme.conf while summer is the season (the
# date and your hemisphere, or a pin; theme.py's "Seasonal themes" says how).
# Only colours and the sets that carry them may be set here (SEASON_KEYS and
# color.*); `theme.py check seasons` reports anything else, which stays the
# theme's all year. The stylesheet colours are in palette.css beside this.

accent=#5ccfd6
gtk_accent_color=teal
icon_theme=Seasons-Summer
wallpaper_prefix=seasons-summer-

# --- Terminals ---------------------------------------------------------------
# The floor #06110c (luminance 0.0047). Measured (WCAG) on it:
#   foreground #e8efda 16.3:1, cursor #5ccfd6 10.4:1;
#   normal  red 6.5, green 11.3, yellow 12.9, blue 9.6, magenta 9.8, cyan 10.4, white 12.3
#           (normal black #12261c is a background colour only, 1.2);
#   bright  black 5.9, red 8.4, green 13.5, yellow 14.1, blue 12.3, magenta 12.4, cyan 12.7, white 17.5
#           (bright black: hints, autosuggestions, comments).
# At the theme's glass 12 over theme.py's worst case (#adadad behind):
# text 13.5:1, the dimmest colour 5.40:1 -- every colour >= 4.5 up to
# glass 20; readable_glass() would allow 38. 12 is kept.
term.background=#06110c
term.foreground=#e8efda
term.cursor=#5ccfd6
term.normal=#12261c #ff5c80 #a3d65c #ecd27a #8fb8ff #d8a8ec #5ccfd6 #c8d2c0
term.bright=#7f947f #ff86a0 #bde680 #f2dc90 #b4d0ff #e8c4f2 #8ce0e4 #f3f6ea

# --- COSMIC apps -------------------------------------------------------------
cosmic.background=#06110c
cosmic.foreground=#e8efda
cosmic.accent=#5ccfd6

# --- Colours drawn by code ---------------------------------------------------
# On the opaque pill #0b1a13 / the card #0c1b14 (contrast), and the nearest status
# where it matters (CIEDE2000).
# CPU, pending, net-down and the temperature graph: the accent (9.7 / 9.6).
color.cpu=#5ccfd6
color.pending=#5ccfd6
color.net_down=#5ccfd6
color.wx_temp=#5ccfd6
# GPU #d8d0f0 (12.1 / 12.0, dE 32.0 from bad).
color.gpu=#d8d0f0
# On the critical fill #8c1a34: the readout (8.3:1 there).
color.cpu_hot=#f3f6ea
color.gpu_hot=#f3f6ea
# Net-up and the warm end of the day range: #ecd27a (12.0 / 11.9, dE 18.1 from good).
color.net_up=#ecd27a
color.wx_warm=#ecd27a
# Danger markup: bad as small text (7.8 / 7.8).
color.danger=#ff86a0
# Weather: cool end and rain #9fc2ff (9.9 / 9.8); the sun is the
# epoch #f2dc90 (13.2 / 13.0, dE 17.9 from good); cloud #bcc8bc (10.4 / 10.3);
# storm #d8d0f0 (12.1 / 12.0); snow the readout (16.4 / 16.2); moon #d6dcf0 (13.1 / 13.0).
color.wx_cool=#9fc2ff
color.wx_rain=#9fc2ff
color.wx_sun=#f2dc90
color.wx_cloud=#bcc8bc
color.wx_storm=#d8d0f0
color.wx_snow=#f3f6ea
color.wx_moon=#d6dcf0
