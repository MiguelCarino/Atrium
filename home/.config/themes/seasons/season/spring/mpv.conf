# ~/.config/themes/seasons/season/spring/mpv.conf -- mpv's colours in
# spring. theme.py appends it after ../../mpv.conf (shape, faces, behaviour):
# a later script-opts-append of the same uosc key wins, as mpv-base.conf
# relies on, so these lines only colour. Colours QUOTED where mpv wants a
# "#": in mpv's config files # starts a comment; uosc takes bare hex.
#
# Contrast, WCAG: foreground_text ink #1a0c12 on the blossom accent
# #f4a8d0 10.3; background_text #eee2e8 on the surface #131b16
# 13.9; the played accent line against the surface 9.5 (a UI
# graphic, >= 3). success= is the good #7fd66a (9.8 on the surface), error= the
# bad #ff6a45, drawn as text on the surface (6.2) AND as the Updater's
# button fill under the ink (6.7). match= is the readout #f6edf1, bold:
# 15.3 on normal rows, 1.6 on the active (accent) row -- the limit every theme
# notes; no one colour reads on both. Messages and subtitles: the readout
# (never white) with a floor-coloured outline (16.6).
script-opts-append=uosc-color=foreground=f4a8d0,foreground_text=1a0c12,background=131b16,background_text=eee2e8,curtain=0c110e,success=7fd66a,error=ff6a45,match=f6edf1,heatmap=f4a8d0
script-opts-append=uosc-chapter_ranges=openings:f4a8d060,endings:46604f80,ads:ff6a4580
osd-color="#F6EDF1"
osd-border-color="#0C110E"
sub-color="#F6EDF1"
sub-border-color="#0C110E"
