# ~/.config/themes/seasons/season/spring/kitty.conf -- kitty's season
# colours, appended by theme.py after ../../kitty.conf (layout only) -- a
# later kitty option wins. The terminal palette itself is term.* in
# theme.conf here.
#
# Contrast, WCAG, on the floor #0c110e: the current tab, ink #1a0c12 on the accent
# #f4a8d0 10.3; the others, text #eee2e8 on the raised plate #1c2820 12.1;
# links in the season's first hue #a8c8f0 11.1; the active split border (accent)
# 10.3, the others the hairline #2c3d32 (decoration); the bell rim in
# the warn colour #f2c14e 11.4 -- a bell is "look here", not a fault -- over
# a raised-plate blink (no light flash on the HDR panel); the scrollbar
# handle #46604f 2.8 (it only shows while scrolled).
tab_bar_background #0c110e
tab_bar_margin_color #0c110e
active_tab_foreground #1a0c12
active_tab_background #f4a8d0
inactive_tab_foreground #eee2e8
inactive_tab_background #1c2820
url_color #a8c8f0
active_border_color #f4a8d0
inactive_border_color #2c3d32
visual_bell_color #1c2820
bell_border_color #f2c14e
scrollbar_handle_color #46604f
