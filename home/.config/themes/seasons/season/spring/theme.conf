# ~/.config/themes/seasons/season/spring/theme.conf -- the spring overlay.
# Spring: blossom pinks and fresh greens. The accent is the blossom pink;
# the fresh leaf green #a8dc8c that says "spring" is only 6 dE from good,
# so it stays in the wallpapers and the mascot, never a UI hue.
#
# theme.py lays this over seasons/theme.conf while spring is the season (the
# date and your hemisphere, or a pin; theme.py's "Seasonal themes" says how).
# Only colours and the sets that carry them may be set here (SEASON_KEYS and
# color.*); `theme.py check seasons` reports anything else, which stays the
# theme's all year. The stylesheet colours are in palette.css beside this.

accent=#f4a8d0
gtk_accent_color=pink
icon_theme=Seasons-Spring
wallpaper_prefix=seasons-spring-

# --- Terminals ---------------------------------------------------------------
# The floor #0c110e (luminance 0.0051). Measured (WCAG) on it:
#   foreground #eee2e8 15.1:1, cursor #f4a8d0 10.3:1;
#   normal  red 6.7, green 10.6, yellow 11.4, blue 8.9, magenta 10.3, cyan 10.5, white 11.1
#           (normal black #1c2820 is a background colour only, 1.2);
#   bright  black 6.6, red 8.3, green 12.0, yellow 13.1, blue 11.1, magenta 12.7, cyan 12.7, white 16.6
#           (bright black: hints, autosuggestions, comments).
# At the theme's glass 12 over theme.py's worst case (#adadad behind):
# text 12.5:1, the dimmest colour 5.56:1 -- every colour >= 4.5 up to
# glass 21; readable_glass() would allow 39. 12 is kept.
term.background=#0c110e
term.foreground=#eee2e8
term.cursor=#f4a8d0
term.normal=#1c2820 #ff6a45 #7fd66a #f2c14e #86b4f0 #f4a8d0 #6fd0c8 #c9c4c6
term.bright=#8a9c90 #ff8a6e #a8dc8c #f7d27a #a8c8f0 #f8c4e0 #98e0d8 #f6edf1

# --- COSMIC apps -------------------------------------------------------------
cosmic.background=#0c110e
cosmic.foreground=#eee2e8
cosmic.accent=#f4a8d0

# --- Colours drawn by code ---------------------------------------------------
# On the opaque pill #131b16 / the card #141c17 (contrast), and the nearest status
# where it matters (CIEDE2000).
# CPU, pending, net-down and the temperature graph: the accent (9.5 / 9.4).
color.cpu=#f4a8d0
color.pending=#f4a8d0
color.net_down=#f4a8d0
color.wx_temp=#f4a8d0
# GPU #c5b3f2 (9.3 / 9.2, dE 38.7 from bad).
color.gpu=#c5b3f2
# On the critical fill #8a2414: the readout (7.8:1 there).
color.cpu_hot=#f6edf1
color.gpu_hot=#f6edf1
# Net-up and the warm end of the day range: #f2c4a0 (11.0 / 10.9, dE 15.7 from warn).
color.net_up=#f2c4a0
color.wx_warm=#f2c4a0
# Danger markup: bad as small text (7.6 / 7.5).
color.danger=#ff8a6e
# Weather: cool end and rain #a8c8f0 (10.2 / 10.1); the sun is the
# epoch #f1e8c8 (14.3 / 14.2, dE 18.8 from warn); cloud #c0c8c2 (10.3 / 10.2);
# storm #c5b3f2 (9.3 / 9.2); snow the readout (15.3 / 15.1); moon #d6dcf0 (12.8 / 12.7).
color.wx_cool=#a8c8f0
color.wx_rain=#a8c8f0
color.wx_sun=#f1e8c8
color.wx_cloud=#c0c8c2
color.wx_storm=#c5b3f2
color.wx_snow=#f6edf1
color.wx_moon=#d6dcf0
