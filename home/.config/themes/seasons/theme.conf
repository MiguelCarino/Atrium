# ~/.config/themes/seasons/theme.conf -- Seasons: a field notebook through
# the year. Calm, rounded, opaque dark plates with a 1 px hairline, small
# caps running heads like an almanac's, and a palette that turns with the
# real date: spring blossom pinks and fresh greens, summer deep green and
# sun gold, autumn amber and rust, winter frost blue and silver. The LLM
# chat's mascot is Sorrel, an original little fox kit under a tree whose
# crown follows the season (mascot_seasons.py).
#
# How it turns: this folder has a season/ folder, which makes it a SEASONAL
# theme (theme.py's "Seasonal themes" has the whole mechanism).
# season/<spring|summer|autumn|winter>/ each hold a theme.conf with the
# season's colours and the sets that carry them (accent, terminal and code
# colours, wallpaper set, icon set) laid over this file, and a palette.css
# (the 22 @define-color s-* names) that theme.py puts BEFORE this theme's
# stylesheets in every GTK3 target. The season is meteorological (whole
# months: MAM spring, JJA summer, SON autumn, DJF winter in the north; six
# months on in the south) in your hemisphere (display.conf
# season_hemisphere=auto|north|south; auto = the weather place's latitude,
# else the time zone's, else north). season_pin= holds one season;
# HYPR_SEASON=<s> overrides both for one process. theme-season.timer runs
# `theme.py season-check` hourly and re-applies when the season changes;
# `theme.py season` says which it is and until when.
#
# What stays the same all year is in THIS file: shape, fonts, language,
# animation, the Hyprland look, the cursor -- lua/display.lua, lua/env.lua
# and display_panel.py read them from here, and a face that changed with the
# season would change every panel's size. The window border still follows
# the season: hypr.accent_stops=1 lets the season's accent= replace stop 1.
#
# The rules every season keeps (each season's palette.css has its numbers):
#   * DARK for the HDR primary: every surface is opaque, the pill s-surface
#     at luminance 0.007-0.010 and the raised well at most 0.019 (orbit's
#     slate is 0.008). Light colours appear only as small fills: the accent
#     of a selected / ON control, the status fills.
#   * text on the pill 13.9-15.4:1, labels 7.8-8.5:1, readouts 15.3-16.9:1
#     (never #ffffff); the accent on the pill 8.3-10.4:1.
#   * the ACCENT ROLE (@cyan) is fixed per season (accent_follow=no): spring
#     blossom #f4a8d0, summer lagoon #5ccfd6, autumn copper #ee9a62, winter
#     frost #8ccaf2 -- each at least 26 dE (CIEDE2000) from that season's
#     good, warn and bad, and the statuses at least 26 dE from each other.
#     Amber and sun gold cannot be the accent: they would read as warn.
#   * status colours distinct in every season (good / warn / bad on the pill
#     >= 9.8 / >= 8.8 / >= 5.1:1; bad as small text is the lighter bad-fg,
#     >= 7.1:1).

name=Seasons
order=90

# --- Accent ------------------------------------------------------------------
# The season's theme.conf sets the real one; this is only a fallback (the
# autumn copper) for a season folder that is missing. Fixed: the pictures
# would vote amber in autumn and gold in summer, both too near warn.
accent=#ee9a62
accent_follow=no

# --- Language ----------------------------------------------------------------
lang=en

# --- Fonts -------------------------------------------------------------------
# Alegreya Sans (Huerta Tipografica, OFL-1.1): a humanist sans with a
# calligraphic, hand-drawn rhythm -- warm and organic for a theme about
# nature and the calendar, and very readable at 11-13 px. True small caps
# (smcp, c2sc) for the almanac labels, tnum and lnum for readouts, static
# Regular / Medium / Bold (no SemiBold: the stylesheets ask for 500 or 700).
# It lacks a few symbols (the triangles, dots, sun, snowflake, note, branch
# glyphs), which fall back to IBM Plex Sans through the list. Line 1.20 em
# against Plex's 1.30, so panels come out a little smaller than cyberpunk's
# (panel.css has the numbers). Source Code Pro (OFL, Fedora's
# adobe-source-code-pro-fonts): a humanist mono that pairs with it, with the
# Bold COSMIC Terminal needs. ~/.local/share/fonts/themes/seasons/README has
# the sources and hashes.
font=Alegreya Sans, IBM Plex Sans
font_mono=Source Code Pro, IBM Plex Mono

# --- Hyprland look -----------------------------------------------------------
# Soft corners, a 2 px frame: the focused window lit in the season's accent
# at one corner fading into a dark green-grey, the rest a near-black hairline.
hypr.rounding=10
hypr.gaps_in=5
hypr.gaps_out=10
hypr.border_size=2
hypr.active_border=rgb(ee9a62) rgb(262c2a) 45deg
hypr.inactive_border=rgb(1d2321)
# The season's accent (or a custom one) replaces the first stop.
hypr.accent_stops=1
# A light frost where the base already blurs, as orbit's: the plates are
# opaque, so the blur only keeps a busy window behind a card from showing
# through as noise. Dimmed to 0.75 so a white window is knocked down first.
hypr.blur=yes
hypr.blur_size=5
hypr.blur_passes=2
hypr.blur_brightness=0.75
hypr.blur_contrast=1.00
hypr.blur_vibrancy=0.10
hypr.blur_vibrancy_darkness=0.20
hypr.blur_noise=0.010
# A soft black drop, no colour.
hypr.shadow=yes
hypr.shadow_range=16
hypr.shadow_render_power=3
hypr.shadow_color=rgba(00000078)

# Unhurried, like turning a page.
anim=smooth

# --- Wallpapers --------------------------------------------------------------
# make-seasons-wallpaper.py --all: seasons-<season>-<scene>.png on every
# monitor, three scenes a season. Each season's theme.conf narrows the set to
# its own (seasons-autumn-...); this prefix is the fallback that matches all.
wallpaper_prefix=seasons-
wallpaper_video=

# --- libadwaita (Nautilus) ---------------------------------------------------
gtk_color_scheme=prefer-dark
gtk_accent_color=orange

# Icons: Papirus-Dark with the season's folder colour (make-icon-theme.py
# seasons-spring ... builds the four); the season's theme.conf names one.
icon_theme=Seasons-Autumn

# The pointer: Catppuccin's light arrow with a dark outline (GPL-2.0,
# ~/.local/share/icons), pale and neutral in every season.
cursor_theme=catppuccin-mocha-light-cursors

crt_suggest=no

# --- Terminals (COSMIC Terminal, kitty) --------------------------------------
# The face and size are the theme's all year; the colours are the season's
# (season/<s>/theme.conf has each season's measured numbers). glass 12 keeps
# every terminal colour >= 4.5:1 over the brightest wallpaper in all four
# seasons (the tightest, autumn, holds up to 19).
term.font=Source Code Pro
term.font_size=14
term.bright_bold=yes
glass=12

# --- COSMIC apps -------------------------------------------------------------
# Colours per season; the corners three quarters of stock, near the 10 px.
cosmic.radius=0.75
