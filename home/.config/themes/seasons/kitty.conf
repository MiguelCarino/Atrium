# ~/.config/themes/seasons/kitty.conf -- kitty options for the seasons theme,
# appended by theme.py to ~/.config/kitty/theme.conf after the term.*
# colours (the season's, from season/<s>/theme.conf). Layout only, the same
# all year: every colour below the palette -- tabs, links, borders, the
# bell -- is in season/<s>/kitty.conf, appended after this, with its
# measured contrast.

# Tabs along the top on the floor colour: the current one the accent plate
# with bold ink and a ›, the others raised plates with the text. A plain
# separator, no powerline arrows.
tab_bar_edge top
tab_bar_style separator
tab_separator " "
tab_bar_min_tabs 2
active_tab_font_style bold
inactive_tab_font_style normal
tab_title_template " {index} {title} "
active_tab_title_template " › {title} "

# The cursor: a beam that blinks slowly (0.75 s, anim=smooth), no trail --
# a smear is a light streak on the HDR panel.
cursor_shape beam
cursor_blink_interval 0.75
cursor_trail 0

url_style curly

# A little room round the text; splits with the accent border on the active
# one, the hairline on the rest.
window_padding_width 10 12
window_border_width 1pt

# The bell: no sound, a dark blink and a warn-coloured rim (the season file).
enable_audio_bell no
visual_bell_duration 0.15

scrollbar scrolled
