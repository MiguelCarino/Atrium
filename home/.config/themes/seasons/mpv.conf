# ~/.config/themes/seasons/mpv.conf -- mpv in the seasons theme (theme.py
# copies it to ~/.config/mpv/theme.conf, after ~/.config/themes/mpv-base.conf
# and before season/<s>/mpv.conf).
#
# A print in the field notebook: plain uosc (no theme HUD -- uosc's own pause
# flash is enough, as in aero, win95, luna and orbit), 8 px corners, calm
# fades (anim=smooth: 160 ms). mpv's messages in Alegreya Sans and the
# subtitles in Alegreya Sans Medium -- a humanist face reads well at
# subtitle size, and Medium is its nearest real cut to the base's SemiBold
# (it has none). How and when the controls show, the controls row and the
# message / subtitle sizes are the same in every theme (mpv-base.conf); this
# file sets the shape and the faces, the same all year. Every colour --
# uosc's, the messages', the subtitles' -- is the season's, in
# season/<s>/mpv.conf, with its measured contrast.

osc=no
osd-bar=no
scripts-append=~~/skins/uosc/uosc

# --- uosc ---------------------------------------------------------------------
script-opts-append=uosc-opacity=menu=0.96,submenu=0.6,tooltip=0.96,curtain=0.7
script-opts-append=uosc-border_radius=8
script-opts-append=uosc-animation_duration=160

# --- mpv's own messages ---------------------------------------------------------
osd-font=Alegreya Sans

# --- subtitles ----------------------------------------------------------------------
sub-font=Alegreya Sans Medium

# Letterbox: black, like every theme -- the bars are not part of the look.
background-color="#000000"
