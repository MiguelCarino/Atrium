# ~/.config/themes/aero/mpv.conf -- mpv in the aero theme (theme.py copies it
# to ~/.config/mpv/theme.conf).
#
# Apple-style glass over the picture: the Liquid Glass skin (an MIT fork of
# uosc, ~/.config/mpv/skins/glass, README there) -- frosted pebbles, spring
# motion, SVG icons -- with Aero's sky blue for its accent and navy glass
# for uosc's own menus. Messages and subtitles soft white with a navy edge
# and a blurred shadow, the way Windows 7 drew text on glass.

# Colours are QUOTED: in mpv's config files # starts a comment, so a bare
# osd-color=#E6FCFF is an empty value (and mpv says so, and ignores it).
osc=no
osd-bar=no
scripts-append=~~/skins/glass/uosc
# mpv's own keys, not the skin's input.conf (skins/glass/input.conf, kept for
# reference): that one turned Up/Down into volume, A/D/W/S into seek/volume,
# and put a big seek icon in the middle of the picture on every skip.

# --- Liquid Glass ---------------------------------------------------------------
script-opts-append=liquid-glass-liquid_glass_theme=dark
script-opts-append=liquid-glass-liquid_glass_accent=4AA3F0
# A touch more frost than its default 1.0: more like Aero's milky glass.
script-opts-append=liquid-glass-liquid_glass_intensity=1.15
script-opts-append=liquid-glass-liquid_glass_show_frost_noise=yes
# Its 1240x420 "never smaller" floor fights the tiling: as good as off.
script-opts-append=liquid-glass-liquid_glass_min_width_landscape=320
script-opts-append=liquid-glass-liquid_glass_min_height_landscape=180

# --- uosc's menus and tooltips, which the skin leaves to uosc -----------------
script-opts-append=uosc-color=foreground=4aa3f0,foreground_text=ffffff,background=0c2240,background_text=f4f9ff,curtain=000000,success=8fe07a,error=ff7a84,match=ffd75e,heatmap=4aa3f0
script-opts-append=uosc-opacity=menu=0.88,submenu=0.6,tooltip=0.9,curtain=0.6
script-opts-append=uosc-border_radius=8

# --- mpv's own messages: the skin's face ------------------------------------------
osd-font=Geist
osd-font-size=30
osd-color="#F4F9FF"
osd-border-color="#B00C2240"
osd-border-size=1.5
osd-shadow-offset=1.5
osd-shadow-color="#80000000"
osd-blur=0.6

# --- subtitles: Selawik, the Segoe UI stand-in --------------------------------------
sub-font=Selawik Semibold
sub-font-size=44
sub-color="#F4F9FF"
sub-border-color="#C00C2240"
sub-border-size=2
sub-shadow-offset=1.5
sub-shadow-color="#90000000"
sub-blur=0.4

background-color="#000000"