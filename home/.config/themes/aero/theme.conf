# ~/.config/themes/aero/theme.conf -- Windows 7 Aero Glass: frosted, sky-blue
# tinted glass with a glossy top half, soft rounded corners and soft shadows,
# white text that carries a faint dark shadow so it reads on bright glass.
#
# Inherits cyberpunk for every key not set here (theme.py explains the
# format; cyberpunk/theme.conf lists every key). The stylesheets next to this
# file do the rest: waybar.css (bar + toolbox), panel.css, launcher.css,
# wofi.css, mako, gtk4.css (Nautilus), hypr.lua (Nautilus as real frosted
# glass). Wallpapers: make-aero-wallpaper.py --all.
#
# The rules this theme keeps (and why the CSS looks the way it does):
#   * the glass is a NAVY tint, not the light sky blue Windows 7 drew: the primary can be
#     HDR, and light glass over a bright window would be a large lit field and
#     put white text under 3:1. Deep blue at 52% (bar) / navy at 80% (panels,
#     which float over windows) keeps white text above 8:1 -- the panels even
#     over a white window after blur (the headers of waybar.css and panel.css
#     have the measurements) -- and the sky blue lives in the gloss, the
#     edges and the wallpaper accent;
#   * the gloss -- white from ~0.30 at the top edge to ~0.10 at mid-height,
#     then nothing -- is the Aero signature, so it is on every pill, button and
#     card; it stops at 50% so it never sits under the lower half of the text;
#   * the accent follows the wallpaper (allowed here), but never raw: it is
#     first tempered into Aero sky blue (@a-tone, 35% accent in #4aa3f0 --
#     the teal and aurora wallpapers pick cyberpunk's own neon cyan and mint,
#     which made the meters and edges read as cyberpunk), then as a FILL
#     mixed into the navy and as TEXT mixed towards white: a neon accent
#     straight from theme-from-wallpaper.py (#2effca mint, #8b3fff violet)
#     would be unreadable one way or the other. mako cannot mix colours, so
#     its rim is a fixed sky blue (mako explains);
#   * status keeps its own hues: good green, warn amber-yellow, bad red. The
#     base files' structural magenta (CPU edge, headings, the launcher's
#     caret) is put back to sky blue, so red on this desktop means "wrong" or
#     "this ends something" (power, the destructive tiles), nothing else.

name=Aero Glass
order=30

# --- Accent ------------------------------------------------------------------
# Follows the primary screen's wallpaper while the display panel's switch is on (the aero
# set gives blue, harmony-blue, teal, mint and violet -- make-aero-wallpaper.py
# keeps the set cool on purpose: a red or orange pick would read as bad/warn).
# This is the accent with the switch off: Windows 7's sky blue.
accent=#4aa3f0
accent_follow=yes

# --- Fonts -------------------------------------------------------------------
# Selawik: Microsoft's open-source stand-in for Segoe UI, the Windows 7 face
# (~/.local/share/fonts/themes/aero/README: source, licence). Latin only, so
# IBM Plex Sans is the fallback for anything it lacks (arrows, Cyrillic);
# theme.py passes the whole list through. Its figures are tabular by default.
font=Selawik, IBM Plex Sans
font_mono=IBM Plex Mono

# --- Hyprland look -----------------------------------------------------------
# Rounded like a Windows 7 frame, more air between windows so the frosted
# wallpaper shows round each one.
hypr.rounding=8
hypr.gaps_in=4
hypr.gaps_out=8
hypr.border_size=3
# A glass frame lit from above: pale at the top, accent in the middle, deep
# blue at the bottom (90deg runs the gradient top to bottom). Translucent, so
# the wallpaper shows through the frame as it did through Aero's. The accent
# takes the middle stop.
hypr.active_border=rgba(d6ecffee) rgba(4aa3f0ee) rgba(16457ff0) 90deg
hypr.inactive_border=rgba(9cc4e866) rgba(1e3c6466) 90deg
hypr.accent_stops=2
# Heavier frost than cyberpunk: size 8 / 4 passes is a wider, softer blur at
# about the same cost (each pass is half resolution). brightness 0.85 still
# knocks a white window down before the navy tint goes over it; contrast
# below 1 is the milky softness of Aero; noise hides banding in the frost.
hypr.blur=yes
hypr.blur_size=8
hypr.blur_passes=4
hypr.blur_brightness=0.85
hypr.blur_contrast=0.95
hypr.blur_vibrancy=0.25
hypr.blur_vibrancy_darkness=0.20
hypr.blur_noise=0.015
# Soft dark shadow under every window: Windows 7 floated its frames.
hypr.shadow=yes
hypr.shadow_range=18
hypr.shadow_render_power=3
hypr.shadow_color=rgba(000000a0)

anim=fancy

# --- Wallpapers --------------------------------------------------------------
# make-aero-wallpaper.py --all: aero-{aurora,blue,harmony,teal,violet}.png on
# all three monitors.
wallpaper_prefix=aero-

# --- libadwaita (Nautilus) ---------------------------------------------------
# Dark: light Adwaita is a near-white page, the largest lit field on the HDR
# screen. gtk4.css makes the dark one navy glass.
gtk_color_scheme=prefer-dark
gtk_accent_color=blue

# Icons: Oxygen (KDE 4, installed with Fedora): the glossy, lit-from-above
# icons of Windows 7's era -- closest to Aero of the sets installed here.
icon_theme=oxygen

crt_suggest=no

# --- Terminals (COSMIC Terminal, kitty) --------------------------------------
# Navy glass, like Nautilus, with Microsoft's console palette ("Campbell")
# lifted for it: the stock red, blue, magenta and cyan were drawn for black
# and fell to ~3.7:1 over a bright wallpaper behind the glass; these are
# >= 4.7:1 there (text 11:1). Source Code Pro: the nearest installed face to
# Consolas, the Windows 7 console font.
term.font=Source Code Pro
# More glass than the others: 25% clear where the text is (its title bar,
# one layer, 50%). Over the brightest wallpaper that leaves white 9.3:1 and
# the dimmest colour 3.9:1 -- below the 4.5 the colours were tuned for, a
# trade asked for; over the darker wallpaper most of the time, well above.
# (The display panel's slider shows the worst case as you drag.)
glass=25

# COSMIC apps: the terminal's own navy, so its title bar and the text area
# are one pane of glass; Aero's sky accent; corners at half the stock size
# (Windows 7's are small).
cosmic.background=#0c2240
cosmic.foreground=#f4f9ff
cosmic.accent=#4aa3f0
cosmic.radius=0.5

term.background=#0c2240
term.foreground=#f4f9ff
term.cursor=#8cc8ff
term.normal=#0c0c0c #ff7a84 #3cd632 #e8c000 #84acff #e08ef0 #52bdf5 #cccccc
term.bright=#8a8a8a #ff8a94 #6ee862 #f9f1a5 #9ab8ff #e8a0f4 #70e0e0 #f2f2f2

# --- Colours drawn by code ---------------------------------------------------
# Sky for the CPU and the "in" series, Windows 7's progress-bar green for the
# GPU, amber for the "out" series and the warm end of the weather. None of
# them is a status colour (the base's magenta CPU label would read as "bad"
# here, where magenta-red means exactly that).
color.cpu=#8cc8ff
color.gpu=#8fe07a
# The critical pill is the red glass with white numbers; the sky-blue label
# drops to ~3:1 on it, so it turns white there too.
color.cpu_hot=#ffffff
color.gpu_hot=#ffffff
color.pending=#8cc8ff
color.net_down=#6cc0ff
color.net_up=#ffc46b
color.danger=#ff6b78
color.wx_temp=#8cc8ff
color.wx_cool=#8cc8ff
color.wx_warm=#ffc46b
color.wx_sun=#ffd75e
color.wx_cloud=#c4d8ee
color.wx_rain=#6cc0ff
color.wx_storm=#b99cff
color.wx_snow=#eef6ff
color.wx_moon=#d7c8ff
