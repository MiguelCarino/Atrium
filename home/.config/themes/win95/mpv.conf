# ~/.config/themes/win95/mpv.conf -- mpv in the win95 theme (theme.py copies
# it to ~/.config/mpv/theme.conf).
#
# Media Player on Windows 95: uosc as solid grey chrome under the picture --
# a chunky opaque BAR timeline, navy for the position and anything chosen,
# square corners, no animation at all (95 had none), opaque menus. mpv's
# messages in black W95FA on a grey plate, like a status bar; subtitles in
# the plain style of the time: white Arial (Liberation Sans) with a black
# outline.
# How and when the controls show, the controls row and the message /
# subtitle sizes are the same in every theme (~/.config/themes/mpv-base.conf,
# written above this file); this one sets colours, faces and shape.

# Colours are QUOTED: in mpv's config files # starts a comment, so a bare
# osd-color=#E6FCFF is an empty value (and mpv says so, and ignores it).
osc=no
osd-bar=no
scripts-append=~~/skins/uosc/uosc

# --- uosc ---------------------------------------------------------------------
script-opts-append=uosc-color=foreground=000080,foreground_text=ffffff,background=acacac,background_text=000000,curtain=000000,success=008000,error=800000,match=000080,heatmap=008080
script-opts-append=uosc-opacity=timeline=1,position=1,chapters=1,slider=1,slider_gauge=1,controls=1,speed=1,menu=1,submenu=0.8,border=1,title=1,tooltip=1,thumbnail=1,curtain=0.6,idle_indicator=0.9,audio_indicator=0.7,buffering_indicator=0.5,playlist_position=1,heatmap=0.5,pause_indicator=0.8
script-opts-append=uosc-timeline_style=bar
# The controls row on a solid grey strip (opacity controls=1 above): its
# icons are drawn in the black text colour, which vanished on dark video
# with no strip behind them.
script-opts-append=uosc-border_radius=0
# A pixel face: an outline only smears it; the bar is opaque, so it needs none.
script-opts-append=uosc-text_border=0
script-opts-append=uosc-font_scale=1.1
script-opts-append=uosc-animation_duration=0

# --- mpv's own messages: a status-bar box ----------------------------------------
osd-font=W95FA
osd-color="#000000"
# Outlined, not opaque-box: that style also drew an empty grey box in the
# top-left corner whenever no message was up. Black text on a thick button-
# grey outline keeps the look of a grey plate behind the letters.
osd-border-color="#C0C0C0"
osd-border-size=3.5

# --- subtitles ----------------------------------------------------------------
sub-font=Liberation Sans
sub-bold=yes
sub-color="#FFFFFF"
sub-border-color="#000000"

background-color="#000000"
