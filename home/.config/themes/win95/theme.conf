# ~/.config/themes/win95/theme.conf -- Windows 95: flat opaque grey, real 3D
# bevels, square corners, navy selection with white text, black type in the
# 8pt system face. The bar is a Windows 95 taskbar strip of raised buttons
# (at the top: nothing here moves it), the panels are dialogs, the launcher
# is the Start menu.
#
# Inherits cyberpunk for every key not set here (theme.py explains the
# format; cyberpunk/theme.conf lists every key). The stylesheets next to this
# file do the rest: waybar.css (bar + toolbox), panel.css, launcher.css,
# wofi.css, mako, gtk4.css (Nautilus). No hypr.lua: Windows 95 had no glass,
# so there is nothing for a window rule to add. Wallpapers:
# ~/.config/hypr/scripts/make-win95-wallpaper.py --all.
#
# The rules this theme keeps (and why the CSS looks the way it does):
#   * the grey is DIMMED: Windows 95's #c0c0c0 face is #acacac here, and
#     every bevel colour is scaled with it (highlight #e4e4e4 instead of
#     white, shadow #727272 instead of #808080). the primary can be HDR, and a 412px
#     panel of #c0c0c0 would be the brightest field on it; at #acacac black
#     text is still 9.3:1 (the header of waybar.css has the measurements);
#   * a bevel is drawn with four inset box-shadows and NO border (border width
#     0): the base files recolour borders in dozens of state rules, and with
#     no border to recolour those rules simply do nothing -- the bevel stays
#     a bevel in every state. Raised = light top/left, dark bottom/right;
#     pressed (a toggle that is ON, the focused window's title) = inverted;
#     a sunken well (the clock capsule, like the Windows 95 tray) = a 1px
#     shadow/highlight pair;
#   * status is a FILL, not a coloured word: a dark hue on #acacac cannot be
#     both a distinct colour and 4.5:1 text, so good is a green button with
#     white text, warn a yellow one with black text, bad maroon and critical
#     red with white text. Green / yellow / red stay three different things;
#   * the accent is fixed (accent_follow=no): navy, the title-bar and
#     selection colour, everywhere.

name=Windows 95
order=40

# --- Accent ------------------------------------------------------------------
# Windows 95's selection navy. Fixed: a wallpaper accent would put a pastel
# where the theme needs a dark fill under white text.
accent=#000080
accent_follow=no

# --- Fonts -------------------------------------------------------------------
# W95FA: Alina Sava's free recreation of the Windows 95 system face
# (~/.local/share/fonts/themes/win95/README: source, licence). A pixel font,
# Latin-1 only, Regular only: IBM Plex Sans is the per-glyph fallback (degree
# sign, arrows...). The stylesheets size it at 12.5px, where one of its grid
# pixels is one screen pixel -- the README explains why that matters.
font=W95FA, IBM Plex Sans
font_mono=IBM Plex Mono

# --- Hyprland look -----------------------------------------------------------
# Square, tight, flat. The focused frame is the Windows 98 title bar, navy
# into #1084d0 left to right (0deg); the rest are the window-face grey,
# dimmed like the CSS face.
hypr.rounding=0
hypr.gaps_in=2
hypr.gaps_out=4
hypr.border_size=3
hypr.active_border=rgb(000080) rgb(1084d0) 0deg
hypr.inactive_border=rgb(9a9a9a) rgb(9a9a9a) 0deg
# The accent is fixed, so the border never follows it.
hypr.accent_stops=
hypr.blur=no
hypr.shadow=no

# Windows 95 did not animate windows: fades only, nothing moves.
anim=calm

# --- Wallpapers --------------------------------------------------------------
# make-win95-wallpaper.py --all: the plain teal desktop and three skies with
# clouds, the same names on all three monitors.
wallpaper_prefix=win95-

# --- libadwaita (Nautilus) ---------------------------------------------------
# prefer-DARK, although the window face is light grey: gtk4.css sets every
# colour libadwaita varies by scheme, so a freshly started app draws the same
# dimmed greys under either. The difference is the app that is ALREADY
# running (the Nautilus that is always open): gsettings reaches it live,
# gtk.css only at its next start. Under prefer-light it dropped at once to
# stock light Adwaita -- a #ffffff view, the brightest field on an HDR primary
# (measured) -- until restarted; under prefer-dark, the cyberpunk scheme, it
# just keeps its old dark look until then. Slate is the closest stock accent
# to the navy gtk4.css sets.
gtk_color_scheme=prefer-dark
gtk_accent_color=slate

# Icons: Chicago95's hand-drawn Windows 95 icons, plus every app it lacks
# in the 16 Windows 95 colours (built by ~/.config/hypr/scripts/
# make-icon-theme.py, which says how).
icon_theme=Win95

# Windows 95 ran on CRTs: the display panel may suggest the scanline filter.
crt_suggest=yes

# --- Terminals (COSMIC Terminal, kitty) --------------------------------------
# The MS-DOS Prompt: light grey on black, opaque, the 16 colours of the
# EGA/VGA text mode -- except where they were unreadable: blue (#0000aa,
# 1.6:1 on black, and ls draws directories in it), red and the brown
# "yellow" are lifted to >= 5:1. The face is the VGA's own 8x16 text-mode
# font (PxPlus IBM VGA 8x16, ~/.local/share/fonts/themes/win95/README),
# pixel-exact at exactly 16px -- hence term.font_size=16.
term.font=PxPlus IBM VGA 8x16
glass=0
term.font_size=16

# COSMIC apps: the dimmed window face with black text and navy selection,
# square -- the terminal's title bar and menus read as a Windows 95 window
# around the DOS box.
cosmic.background=#acacac
cosmic.foreground=#000000
cosmic.accent=#000080
cosmic.radius=0

term.background=#000000
term.foreground=#aaaaaa
term.cursor=#aaaaaa
term.normal=#000000 #e04040 #00aa00 #c26a14 #6c6cff #c040c0 #00aaaa #aaaaaa
term.bright=#555555 #ff5555 #55ff55 #ffff55 #8080ff #ff55ff #55ffff #ffffff

# --- Colours drawn by code ---------------------------------------------------
# All of them land on the #acacac face (bar pills, panel cards), so they are
# the DARK Windows 95 hues, each >= 4.5:1 on the face where it is text (CPU
# and GPU labels, "Sure?") and >= 3:1 where it is a glyph or a graph line.
color.cpu=#000080
color.gpu=#004800
# ...except on the critical pill, which is solid red (@critical) with white
# numbers: navy on that red is 3.3:1, white is 5:1 like the numbers beside it.
color.cpu_hot=#ffffff
color.gpu_hot=#ffffff
color.pending=#800000
color.net_down=#000080
color.net_up=#800000
color.danger=#800000
color.wx_temp=#000080
color.wx_cool=#000080
color.wx_warm=#800000
color.wx_sun=#6b5000
color.wx_cloud=#3a3a3a
color.wx_rain=#000080
color.wx_storm=#5a006a
color.wx_snow=#2a4a6a
color.wx_moon=#3a2a6a

# --- The taskbar (scripts/dock.py, layout "taskbar"; dock.css next to this
# file draws it) --------------------------------------------------------------
# The word beside the start button's glyph: the Windows 95 taskbar's button said
# it. Only the word, no logo.
dock.start=Start
