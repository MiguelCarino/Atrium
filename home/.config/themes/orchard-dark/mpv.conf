# ~/.config/themes/orchard-dark/mpv.conf -- mpv in the orchard-dark theme
# (theme.py copies it to ~/.config/mpv/theme.conf). The same player as
# orchard/mpv.conf (a video player's chrome is dark in both appearances),
# repeated here because theme files do not inherit.
#
# The system's own minimal player: plain uosc (no theme HUD), the controls
# and menus on a dark smoky grey under white -- whatever the appearance, a
# video player's chrome is dark, as the real one's is -- a thin 6px bar for
# the timeline, rounded corners, a half-dark curtain behind menus, quick
# fades. mpv's messages in Inter with no outline, only a soft 1px smoky
# shadow; the subtitles in Inter, white with a dark outline. How and when the controls show, the controls row and the message
# / subtitle sizes are the same in every theme (~/.config/themes/
# mpv-base.conf, written above this file); this one sets colours, faces and
# shape (and, where the spec asks, the timeline's look).
#
# Contrast, WCAG: foreground_text and background_text are the same pair
# both ways, white on #1e1e1e 16.7:1; the played white line against the
# unplayed dark 16.7 (a UI graphic). success= is the dark-mode green #30d158
# (8.2 on #1e1e1e), error= the dark-mode red #ff453a (4.9) -- drawn as text
# on the plate AND as the Updater's button fill under the dark text (4.9
# too). match= (the search-match letters) is the accent blue #409cff,
# bold (5.9 on the plate; on the active, white row it is the plate's dark
# text that shows the match -- the limit lofi and moe note too).
#
# Colours are QUOTED: in mpv's config files # starts a comment (the uosc
# lists below carry no #: uosc reads bare hex).

osc=no
osd-bar=no
scripts-append=~~/skins/uosc/uosc

# --- uosc ---------------------------------------------------------------------
script-opts-append=uosc-color=foreground=ffffff,foreground_text=1e1e1e,background=1e1e1e,background_text=ffffff,curtain=000000,success=30d158,error=ff453a,match=409cff,heatmap=ffffff
script-opts-append=uosc-opacity=menu=0.94,submenu=0.6,tooltip=0.94,curtain=0.5,timeline=0.85,controls=0
script-opts-append=uosc-border_radius=8
script-opts-append=uosc-animation_duration=120
script-opts-append=uosc-timeline_style=bar
script-opts-append=uosc-timeline_size=6
script-opts-append=uosc-timeline_border=0
script-opts-append=uosc-chapter_ranges=openings:ffffff40,endings:ffffff40,ads:ff453a80

# --- mpv's own messages ---------------------------------------------------------
osd-font="Inter"
osd-font-size=30
osd-color="#FFFFFF"
osd-border-size=0
osd-shadow-offset=1
# osd-back-color is the colour of that 1px shadow under the default
# outline-and-shadow style (mpv-base.conf's osd-shadow-color is its alias):
# the smoky grey at 70%, a soft drop rather than a black outline.
osd-back-color="#B21E1E1E"

# --- subtitles ----------------------------------------------------------------------
sub-font="Inter"
sub-color="#FFFFFF"
sub-border-color="#141414"

# Letterbox: black, like every theme -- the bars are not part of the look.
background-color="#000000"
