# ~/.config/themes/orchard-dark/kitty.conf -- kitty options for the
# orchard-dark theme, appended by theme.py to ~/.config/kitty/theme.conf
# after the term.* colours (the near-black page #1e1e1e; theme.conf explains
# them).
#
# orchard's terminal (orchard/kitty.conf) in the dark profile: the same
# block cursor at a half-second blink, top tab strip, curly links, silent
# bell and 8px of air; only the colours change.

# Tabs: the current tab bold on the page lifted a little (#2c2c2e, text
# 11.7:1), the others dim grey on the strip (#a1a1a6 on #161617 7.0:1).
tab_bar_edge top
tab_bar_style separator
tab_separator " "
tab_bar_min_tabs 2
tab_bar_background #161617
tab_bar_margin_color #161617
active_tab_foreground #ebebf0
active_tab_background #2c2c2e
active_tab_font_style bold
inactive_tab_foreground #a1a1a6
inactive_tab_background #161617
inactive_tab_font_style normal
tab_title_template "  {title}  "
active_tab_title_template "  {title}  "

cursor_shape block
cursor_blink_interval 0.5
cursor_trail 0

# Links: the dark accent text blue (#409cff, 5.9:1 on the page), curly.
url_color #409cff
url_style curly

# Splits: a neutral hairline, lighter on the active one.
window_padding_width 8
window_border_width 1pt
active_border_color #636366
inactive_border_color #3a3a3c

# The bell: silent and no flash; the tab's title gets kitty's bell mark.
enable_audio_bell no
visual_bell_duration 0

scrollbar scrolled
scrollbar_handle_color #636366
