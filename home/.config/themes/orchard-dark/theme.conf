# ~/.config/themes/orchard-dark/theme.conf -- Orchard Dark: the frosted desktop in dark appearance.
# The same desktop as orchard/ -- menu bar, notch, frosted cards, Search,
# traffic lights, springy motion, Hum the bee, the 25 era wallpapers -- in
# the dark appearance: a smoky translucent bar, graphite cards, light text,
# the brighter dark-mode system colours.
#
# inherit=orchard: every key not set here is orchard's (fonts, hypr shape,
# blur, anim=spring, wallpapers, the island and menu-bar keys, the traffic
# lights on the left, crt_suggest, the weather glyph colours). Stylesheets do
# NOT inherit, so this folder has its own full set of files; they keep
# orchard's rules line for line and change only the PALETTE block at the top
# of each (and the header's numbers).
#
# Day and night: ~/.config/hypr/scripts/theme-schedule.py day orchard;
# theme-schedule.py night orchard-dark.
#
# HDR: everything here is dark. The bar is alpha(#1e1e20, 0.60) over the
# blur (about #38383a over a mid-grey wallpaper, luminance 0.040), the cards
# alpha(#28282a, 0.86), Nautilus's view #1e1e1e; the only light pixels are
# text, the white slider fill and the switch knobs. Text #ebebf0 is 9.9:1
# on that bar and 10.5-12.4:1 on the cards (each file's header has its
# numbers).

inherit=orchard
name=Orchard Dark
order=101

# The dark-mode system blue: brighter, so it holds on graphite. As text the
# stylesheets use #409cff (4.4-5.2:1 on the cards); as a fill under white the
# deeper #0071e3 (4.7:1).
accent=#0a84ff

# WhiteSur's dark variant: light symbolic icons for the graphite faces.
icon_theme=WhiteSur-dark

# --- Hyprland look -----------------------------------------------------------
# The hairline turns WHITE at low alpha (a dark window's lit edge), the
# shadows deeper, the frost a step darker.
hypr.active_border=rgba(ffffff2e)
hypr.inactive_border=rgba(ffffff1a)
hypr.shadow_color=rgba(0000008c)
hypr.shadow_color_inactive=rgba(00000050)
hypr.blur_brightness=0.80

# --- Terminals ---------------------------------------------------------------
# The terminal's dark profile: a near-black page #1e1e1e (opaque), light
# grey text, the dark-mode system hues. Measured (WCAG) on #1e1e1e:
#   foreground #e5e5e5 13.2:1, cursor #7f7f7f 4.2:1;
#   normal  red 4.9, green 8.7, yellow 9.7, blue 5.2, magenta 5.5, cyan
#           8.0, white 9.1 (normal black is a background colour only);
#   bright  black #666666 2.9 (the grey of dim output), red 5.9, green
#           10.6, yellow 12.7, blue 7.1, magenta 8.0, cyan 10.6,
#           white 13.2.
term.background=#1e1e1e
term.foreground=#e5e5e5
term.cursor=#7f7f7f
term.normal=#000000 #ff453a #32d74b #e5c400 #4e8cff #d070d0 #00c7d4 #bfbfbf
term.bright=#666666 #ff6961 #5de879 #ffe047 #7aa9ff #e39be3 #5ce1e6 #e5e5e5

cosmic.background=#1e1e1e
cosmic.foreground=#e5e5e5
cosmic.accent=#0a84ff

# --- Colours drawn by code ---------------------------------------------------
# The bar and the cards are dark now, so the CPU / GPU labels and graphs and
# the network graphs are light; the hot / danger / pending hues are the
# dark-mode system ones. The weather glyph colours stay orchard's (they were
# chosen for the black notch and the blue weather well, both unchanged); only
# the temperature line, which sits on the card, follows the dark accent text.
color.cpu=#d1d1d6
color.gpu=#d1d1d6
color.cpu_hot=#ff453a
color.gpu_hot=#ff453a
color.pending=#ff9f0a
color.net_down=#ebebf0
color.net_up=#ebebf0
color.danger=#ff453a
color.wx_temp=#409cff
