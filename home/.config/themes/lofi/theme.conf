# ~/.config/themes/lofi/theme.conf -- Lo-fi: a study room at dusk. A rainy
# window with city bokeh, a warm desk lamp, a sleepy ginger cat (Miso, the
# LLM chat's mascot), vinyl and cassettes. Dusky violet-indigo glass, cream
# text, a peach lamp accent; soft, round, slow, with a faint film grain over
# every frosted pane. All art is drawn from scratch (make-lofi-wallpaper.py),
# the sounds are synthesized (make-theme-sounds.py lofi); nothing names or
# copies any channel's character or art.
#
# Inherits cyberpunk for every key not set here (theme.py explains the
# format; cyberpunk/theme.conf lists every key). The files next to this one do
# the rest: waybar.css (bar + toolbox), panel.css, launcher.css, wofi.css,
# mako, gtk4.css (Nautilus), llm-chat.css, hypr.lua, kitty.conf, prompt.sh,
# mpv.conf, grain.png (the film grain the stylesheets lay over their glass).
#
# The rules this theme keeps:
#   * DARK dusk glass, so the HDR primary never shows a large lit field: the
#     bar's pills come out at luminance 0.018-0.029 (over the wallpaper's dark
#     top band #191528 and over the brightest band the generator allows,
#     #5a4a6e), the cards at <= 0.027, Nautilus's view at 0.016. Only small
#     fills are light: a selected tile in peach (0.47), the warn fill (0.67);
#   * cream text #e8dccb, never white: 11.5:1 on a pill over the dark band,
#     9.8:1 over the bright one, 12.3:1 on a card, 10.1:1 on a card over a
#     white window after blur. The brightest text anywhere is #f3e9dc;
#   * the ACCENT ROLE (@cyan in every base stylesheet, mako's border) is the
#     peach lamp #f2a477: text-safe on every surface (6.5-8.5:1), and ink
#     #2a1d2a on it as a fill 7.9:1. Fixed (accent_follow=no, below says why);
#     the display panel's custom colour still replaces it, because every
#     stylesheet uses @cyan for the accent role;
#   * status keeps its own hues, all distinguishable from each other and from
#     the peach: good sage #a6d6a0, warn honey #e8d77a, bad berry #f58a98,
#     critical a deep berry fill #9c3352 under cream. Peach (hue 22) is 29
#     degrees from warn and 30 from bad, and is never used as a status; warn
#     and bad pills always keep their glyph as well. The base files'
#     STRUCTURAL magenta (CPU edge, headings, the playing player) is put back
#     to lilac #b9a3ea, as aero puts it back to sky: red-pink here means "bad"
#     or "this ends something", nothing else.

name=Lo-fi
order=60

# --- Accent ------------------------------------------------------------------
# Fixed. A dusk wallpaper's vote is a neon orange (which reads as warn next
# to the honey) or a violet, and violet tempered into peach comes out #d88b99
# -- the bad berry. moe keeps its accent fixed for the same reason. The
# wallpapers are still drawn so their vote lands on peach or lilac, should
# the switch ever be allowed.
accent=#f2a477
accent_follow=no

# --- Language ----------------------------------------------------------------
lang=en

# --- Fonts -------------------------------------------------------------------
# Nunito (OFL, variable): a soft, rounded sans for everything; Comfortaa (the
# Fedora package aajohan-comfortaa-fonts, OFL) for headings and the clock, set
# in the stylesheets. Rec Mono Casual (Recursive's brushy mono, OFL) for the
# terminals and code. ~/.local/share/fonts/themes/lofi/README has the sources.
# Nunito is about as wide as Plex with taller lines: panels come out within
# 2-3% of cyberpunk's (a few px taller, the display panel 12 px narrower;
# panel.css has the numbers).
font=Nunito, IBM Plex Sans
font_mono=Rec Mono Casual, IBM Plex Mono

# --- Hyprland look -----------------------------------------------------------
# Round and airy. The focused frame is lamplight: peach -> dusty rose ->
# lilac. A slow, heavy frost (size 8 / 3 passes) dimmed to 0.80 so a white
# window behind a card is knocked down before the dusk tint goes over it.
hypr.rounding=12
hypr.gaps_in=5
hypr.gaps_out=10
hypr.border_size=2
hypr.active_border=rgb(f2a477) rgb(c9a0c8) rgb(9f8fd8) 45deg
hypr.inactive_border=rgba(3a2f5588) rgba(2a234288) 45deg
# The accent is fixed, but a custom accent (the display panel's colour
# button) replaces the peach stop.
hypr.accent_stops=1
hypr.blur=yes
hypr.blur_size=8
hypr.blur_passes=3
hypr.blur_brightness=0.80
hypr.blur_contrast=0.90
hypr.blur_vibrancy=0.20
hypr.blur_vibrancy_darkness=0.25
# The film grain: about 2.5x the base's noise, visible as grain in every
# frosted pane (the stylesheets add grain.png on top of their glass).
hypr.blur_noise=0.030
# A deep violet shadow, soft and wide: things float in a dim room.
hypr.shadow=yes
hypr.shadow_range=24
hypr.shadow_render_power=3
hypr.shadow_color=rgba(0c0818a0)

# Slow: easeOutQuint, no overshoot. (calm makes window moves instant, fancy
# bounces -- neither is lo-fi.)
anim=smooth

# --- Wallpapers --------------------------------------------------------------
# make-lofi-wallpaper.py --all: lofi-{rain,desk,rooftop,sunset,vinyl}.png on
# every monitor. No moving wallpaper yet (a rain-on-glass loop is planned).
wallpaper_prefix=lofi-
wallpaper_video=

# --- libadwaita (Nautilus) ---------------------------------------------------
# prefer-dark with every colour set by gtk4.css, as moe and win95 do: under
# prefer-light a running Nautilus drops to stock white until restarted -- a
# #ffffff field on the HDR panel.
gtk_color_scheme=prefer-dark
gtk_accent_color=orange

# Icons: Papirus-Dark with pale orange folders (make-icon-theme.py lofi
# builds the folder links; Papirus itself is in ~/.local/share/icons,
# README-downloaded).
icon_theme=Lofi

# The pointer: Catppuccin Mocha peach (GPL-2.0, ~/.local/share/icons;
# README-downloaded there) -- a peach arrow with a dark outline, the lamp's
# colour, visible on the dusk glass and on a white page alike.
cursor_theme=catppuccin-mocha-peach-cursors

crt_suggest=no

# --- Terminals (COSMIC Terminal, kitty) --------------------------------------
# The room at night: deep indigo, cream ink, pastel colours that stay soft.
# On #1c1830 (luminance 0.011): text 12.7:1, the peach cursor 8.5:1; normal
# red 7.1, green 10.1, yellow 11.2, blue 7.7, magenta 8.0, cyan 9.1, white
# 10.9; bright red 8.8, green 12.1, yellow 12.7, blue 9.6, magenta 10.0,
# cyan 11.3, white 14.3. Bright black is #8a80a6 (4.7:1): it was #7a7095 at
# 3.7, too low for the hints it carries, so it was raised.
# With the glass below over a bright wallpaper (#8a6e7e / #c09080 behind):
# text 11.0 / 10.2, blue 6.7 / 6.2; bright black falls to 4.0 / 3.8 there
# (theme.py's own worst case, #adadad behind: text 9.8, dimmest colour 5.5,
# bright black 3.6) -- it is used only for dim hints (autosuggestions,
# comments), never for anything that must be read.
# Rec Mono Casual: static Regular / Bold / Italic / BoldItalic upstream, so
# COSMIC Terminal accepts it as is.
term.font=Rec Mono Casual
term.font_size=15
term.bright_bold=no
glass=14
term.background=#1c1830
term.foreground=#e8dccb
term.cursor=#f2a477
term.normal=#2e2944 #ec8a9a #a6d39a #e9cf7e #94aee6 #c7a2e6 #86c9c4 #d9ccbc
term.bright=#8a80a6 #f4a3b0 #bde3b2 #f3dc98 #aec2f0 #d8bbf0 #a5dcd7 #f3e9dc

# --- COSMIC apps (the terminal's title bar...) -------------------------------
# The terminal's own indigo, so the title bar and the text are one pane; the
# peach accent; corners a little rounder than stock.
cosmic.background=#1c1830
cosmic.foreground=#e8dccb
cosmic.accent=#f2a477
cosmic.radius=1.5

# --- Colours drawn by code ---------------------------------------------------
# Graph lines, Pango labels and weather glyphs on the dusk pills and cards:
# 6.0-10.8:1 on a pill over the dark band, 5.7-9.3:1 over the bright one.
# Light peach for the CPU and the "out" series, lilac for the GPU (none of
# them a status hue: the base's magenta CPU label would read as "bad" here),
# rain blue for the "in" series and the cool end of the weather.
color.cpu=#f6b48c
color.gpu=#b9a3ea
# The critical pill is the deep berry fill; the labels turn cream-bright on
# it (#f3e9dc on #9c3352, 5.8:1).
color.cpu_hot=#f3e9dc
color.gpu_hot=#f3e9dc
color.pending=#b9a3ea
color.net_down=#8fbfe0
color.net_up=#f6b48c
color.danger=#f58a98
color.wx_temp=#f6b48c
color.wx_cool=#8fbfe0
color.wx_warm=#f6b48c
color.wx_sun=#f2d49a
color.wx_cloud=#c3b8d0
color.wx_rain=#8fbfe0
color.wx_storm=#b9a3ea
color.wx_snow=#eae4f2
color.wx_moon=#d6c8ff
