# ~/.config/themes/lofi/kitty.conf -- kitty options for the lofi theme, appended
# by theme.py to ~/.config/kitty/theme.conf after the term.* colours.

# Tabs: round "powerline" pebbles on the night background; the current one the
# peach lamp with ink text (7.9:1) and a ☾, the others dusk with soft cream
# (8.8:1).
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_bar_background #1c1830
tab_bar_margin_color #1c1830
active_tab_foreground #2a1d2a
active_tab_background #f2a477
active_tab_font_style bold
inactive_tab_foreground #d9ccbc
inactive_tab_background #2e2944
inactive_tab_font_style normal
tab_title_template "{index} {title}"
active_tab_title_template "☾ {title}"

# The cursor: a peach beam that blinks slowly (1 s, the theme's slow pace), a
# lilac trail when it jumps that fades out gently.
cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 1.0
cursor_trail 3
cursor_trail_decay 0.15 0.5
cursor_trail_start_threshold 3
cursor_trail_color #b9a3ea

# Links: the terminal's soft blue, a plain underline.
url_color #94aee6
url_style straight

# Room to breathe; splits with a peach border on the active one.
window_padding_width 12 14
window_border_width 1pt
active_border_color #f2a477
inactive_border_color #2e2944

# The bell: a dim plum blink (no light flash on the HDR panel), a peach rim,
# no sound.
enable_audio_bell no
visual_bell_duration 0.2
visual_bell_color #3a2f55
bell_border_color #f2a477

scrollbar scrolled
scrollbar_handle_color #b9a3ea
