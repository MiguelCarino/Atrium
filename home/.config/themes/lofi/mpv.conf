# ~/.config/themes/lofi/mpv.conf -- mpv in the lofi theme (theme.py copies it
# to ~/.config/mpv/theme.conf).
#
# Calm, like a tape on the desk: uosc with the timeline in the peach lamp
# colour, dusk menus with cream text, rounded corners, soft fades;
# lofi-hud.lua's one small card in Comfortaa (▮▮ paused · side A, only while
# paused). Messages and subtitles in cream Nunito with a night outline -- no
# white, no glow.
# How and when the controls show, the controls row and the message /
# subtitle sizes are the same in every theme (~/.config/themes/mpv-base.conf,
# written above this file); this one sets colours, faces and shape.
#
# Colours are QUOTED: in mpv's config files # starts a comment.

osc=no
osd-bar=no
scripts-append=~~/skins/uosc/uosc
scripts-append=~~/skins/hud/lofi-hud.lua

# --- uosc ---------------------------------------------------------------------
# foreground: the peach lamp (the line, the chosen item) under ink 7.9:1;
# background: dusk #2a2342 under cream 11.0:1. error= is drawn as text on
# dusk AND as the Updater's button fill under foreground_text ink, so it is
# the light berry f58a98 (ink on it 6.9:1, on dusk 6.3:1); the deep berry
# 9c3352 stays only in chapter_ranges, where it carries no text. match= (the
# search-match letters) is drawn on normal rows AND on the active row, which
# is the peach foreground at 0.8: no one colour reads well on both, so it is
# cream-hi f3e9dc (12.3:1 on dusk, 2.4:1 on the active row, drawn bold);
# lilac was 1.3:1 there. moe has the same uosc limit.
script-opts-append=uosc-color=foreground=f2a477,foreground_text=2a1d2a,background=2a2342,background_text=e8dccb,curtain=1c1830,success=a6d6a0,error=f58a98,match=f3e9dc,heatmap=f2a477
script-opts-append=uosc-opacity=timeline=0.92,position=1,chapters=0.9,slider=0.92,slider_gauge=1,controls=0,speed=0.8,menu=0.96,submenu=0.6,border=1,title=1,tooltip=0.96,thumbnail=1,curtain=0.7,idle_indicator=0.8,audio_indicator=0.6,buffering_indicator=0.4,playlist_position=0.9,heatmap=0.5,pause_indicator=0.8
script-opts-append=uosc-border_radius=10
# Soft, the theme's pace (moe 180, cyberpunk snaps); slower than this felt
# like the controls were lagging behind the pointer.
script-opts-append=uosc-animation_duration=200
script-opts-append=uosc-chapter_ranges=openings:f2a47760,endings:b9a3ea60,ads:9c335280

# --- mpv's own messages ---------------------------------------------------------
osd-font=Nunito
osd-color="#F3E9DC"
osd-border-color="#1C1830"

# --- subtitles ----------------------------------------------------------------------
sub-font=Nunito
sub-bold=yes
sub-color="#F3E9DC"
sub-border-color="#1C1830"

# Letterbox: black, like every theme -- the bars are not part of the look.
background-color="#000000"
