# Local override (enabled 2026-10).
[Service]
# Hyprland sessions only: COSMIC has its own notification daemon, and two
# cannot both own org.freedesktop.Notifications. Args: OnlyShowIn, NotShowIn.
ExecCondition=/usr/lib/systemd/systemd-xdg-autostart-condition "Hyprland" ""
# Desktop theme (~/.config/hypr/scripts/theme.py): mako/config include=s
# generated/theme (and generated/accent), and generated/ is never in the
# dotfiles repo, so a fresh restore has neither. `ensure` creates only the
# missing ones and touches nothing else; "-" so a broken theme.py can never
# keep mako down.
ExecStartPre=-/usr/bin/python3 %h/.config/hypr/scripts/theme.py ensure
# The shipped unit never restarts mako. Without a daemon, Firefox and
# Thunderbird fall back to drawing notifications as tiled windows.
Restart=on-failure
RestartSec=2
