# Project contexts (~/.config/hypr/scripts/contexts.py): mako/config
# include=s generated/contexts (the notification filter of the current
# project), and generated/ is never in the dotfiles repo, so a fresh restore
# does not have it -- and mako refuses its whole config when an included file
# is missing. `ensure` writes an empty one only when it is missing; "-" so a
# broken script can never keep mako down. Next to notify-settings.conf.
[Service]
ExecStartPre=-/usr/bin/python3 %h/.config/hypr/scripts/contexts.py ensure
