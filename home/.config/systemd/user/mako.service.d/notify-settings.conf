# Settings > Notifications (~/.config/hypr/scripts/notify-settings.py):
# mako/config include=s generated/settings, and generated/ is never in the
# dotfiles repo, so a fresh restore does not have it -- and mako refuses its
# whole config when an included file is missing. `ensure` writes it from the
# saved settings (or the defaults) only when it is missing; "-" so a broken
# script can never keep mako down. Next to hyprland.conf's theme.py ensure.
[Service]
ExecStartPre=-/usr/bin/python3 %h/.config/hypr/scripts/notify-settings.py ensure
