# Local override (enabled 2026-10): Hyprland sessions only. graphical-session.target
# is also reached in a COSMIC login, where this has no business. The helper's
# args are OnlyShowIn, NotShowIn, checked against XDG_CURRENT_DESKTOP.
[Service]
ExecCondition=/usr/lib/systemd/systemd-xdg-autostart-condition "Hyprland" ""
