# The secret service (org.freedesktop.secrets: browser and Wi-Fi passwords,
# secret-tool, the launcher's passwords, backup.py's repository key).
#
# Fedora 45 replaced gnome-keyring with oo7. oo7-daemon is NOT bus-activatable:
# GNOME starts it from gnome-session-services.target, so a Hyprland login had
# no secret service at all, and pam_oo7's unlock helper gave up after 120 s
# ("oo7_daemon_login: Timed out after 120s, no daemon connected"). Starting it
# with the graphical session hands it the login password in time.
#
# Fedora 44 has no oo7-daemon: a Wants= on a unit that does not exist does
# nothing, and gnome-keyring is started by pam_gnome_keyring there, as before.
[Unit]
Wants=oo7-daemon.service
