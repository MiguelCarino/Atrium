# Reminders for the calendars in ~/.config/hypr/calendars.conf (ICS files,
# subscriptions) and khal, beside timers.py's for Evolution: the same
# 5-minute timer, the same alarm, lead time and on/off switch
# (~/.config/hypr/scripts/calendar_events.py remind; its docstring has the
# rest). "-": a failure here never fails the unit. With no calendars.conf it
# returns at once, without importing anything heavy.
[Service]
ExecStart=-/usr/bin/python3 %h/.config/hypr/scripts/calendar_events.py remind
TimeoutStartSec=90
