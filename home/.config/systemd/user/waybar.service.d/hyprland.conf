# Local overrides for Fedora's waybar.service (enabled 2026-10).
[Service]
# Hyprland only: graphical-session.target is also reached in a COSMIC login,
# where this bar has no business. Same helper the shipped ExecCondition uses
# (args: OnlyShowIn, NotShowIn), checked against XDG_CURRENT_DESKTOP.
ExecCondition=/usr/lib/systemd/systemd-xdg-autostart-condition "Hyprland" ""
# Desktop theme (~/.config/hypr/scripts/theme.py): every generated file that
# style.css, style-toolbox.css and panel.css import must exist before the bar
# starts -- a missing @import target leaves waybar completely unstyled -- and
# generated/ is never in the dotfiles repo, so a fresh restore has none.
# `ensure` creates only the missing ones and touches nothing else; "-" so a
# broken theme.py can never keep it down.
ExecStartPre=-/usr/bin/python3 %h/.config/hypr/scripts/theme.py ensure
# Restart on ANY exit, not just failures: ALT+G (scripts/bar-restart.sh) uses
# `systemctl restart`, but a bar that quits cleanly (a config error caught at
# startup, say) should also come back -- the start-limit below stops a loop.
Restart=always
RestartSec=2
# Stop is SIGTERM to the whole cgroup, which also takes the module scripts'
# own children (playerctl --follow, pactl subscribe) with it. A healthy bar
# exits in milliseconds; a hung one is SIGKILLed after 3 s, not 90.
TimeoutStopSec=3
# Never `systemctl reload waybar`: the shipped ExecReload is SIGUSR2, which
# can crash waybar 0.15 (see scripts/bar-restart.sh). Restart instead.

[Unit]
StartLimitIntervalSec=30
StartLimitBurst=5
