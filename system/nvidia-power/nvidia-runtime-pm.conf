# Atrium (system/nvidia-power): let the NVIDIA driver power a laptop's
# offload card down while nothing uses it (runtime D3, "fine-grained" power
# management). 0x02 = on. The driver's default (0x03) turns it on only for
# Ampere and newer notebook chips, so a Turing card (GeForce MX450, GTX 16xx,
# RTX 20xx mobile) stayed powered the whole session.
# Fedora's 80-nvidia-pm.rules already sets power/control=auto on the card.
# Takes effect at the next boot (the module is not in the initramfs).
options nvidia NVreg_DynamicPowerManagement=0x02
