# Railguard (~/.config/hypr/scripts/railguard.py): the kernel's own keys for a
# desktop that no longer answers. Fedora allows only "sync" (16); this adds
# 4 keyboard (SAK, raw mode), 32 remount read-only, 64 signal processes and
# 128 reboot. They work while nothing on screen moves:
#     Alt+SysRq+F         run the OOM killer once: ends the biggest process
#     Alt+SysRq+R,E,I,S,U,B   (a second apart) take the keyboard back, end
#                         everything politely then by force, sync, remount
#                         read-only, reboot -- a clean reboot, not a reset
# Not allowed: 2/8 (console log level, debug dumps), 1 (everything).
kernel.sysrq = 244
